<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Стример-хаб | Оверлей</title>
    <style>
        /* ===== БАЗА ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: transparent !important;
            min-height: 100vh;
            color: #fff;
            padding: 10px;
            overflow: hidden;
        }

        /* ===== КАРТОЧКИ ===== */
        .card {
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 15px;
            margin-bottom: 10px;
        }

        .card-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: rgba(255, 255, 255, 0.5);
        }

        .card-title .icon {
            font-size: 18px;
        }

        /* ===== ВКЛАДКИ ОВЕРЛЕЯ ===== */
        .overlay-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }

        .overlay-tab-btn {
            padding: 6px 16px;
            border: none;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.4);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            border: 1px solid transparent;
        }

        .overlay-tab-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .overlay-tab-btn.active {
            background: rgba(145, 70, 255, 0.2);
            border-color: rgba(145, 70, 255, 0.3);
            color: #fff;
        }

        /* ===== КОНТЕЙНЕРЫ ВКЛАДОК ===== */
        .tab-content {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== УЧАСТНИКИ ===== */
        .participants-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 6px;
            margin: 10px 0;
            max-height: 50vh;
            overflow-y: auto;
            padding: 4px;
        }

        .participants-grid::-webkit-scrollbar {
            width: 4px;
        }

        .participants-grid::-webkit-scrollbar-thumb {
            background: rgba(145, 70, 255, 0.3);
            border-radius: 10px;
        }

        .participant-chip {
            padding: 6px 12px;
            background: rgba(145, 70, 255, 0.15);
            border: 1px solid rgba(145, 70, 255, 0.15);
            border-radius: 16px;
            font-size: 12px;
            text-align: center;
            transition: all 0.3s;
            animation: chipIn 0.3s ease;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        @keyframes chipIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        .participant-count {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.4);
        }

        /* ===== КОЛЕСО ===== */
        .wheel-wrapper {
            position: relative;
            width: 300px;
            height: 300px;
            margin: 0 auto;
        }

        #wheelCanvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 0 40px rgba(145, 70, 255, 0.15);
        }

        #wheelCanvas.spinning {
            box-shadow: 0 0 60px rgba(145, 70, 255, 0.3);
        }

        .wheel-result {
            font-size: 24px;
            font-weight: 700;
            padding: 12px 24px;
            background: rgba(0, 212, 255, 0.08);
            border: 1px solid rgba(0, 212, 255, 0.15);
            border-radius: 12px;
            text-align: center;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
            transition: all 0.3s;
        }

        .wheel-result.winner {
            background: rgba(249, 202, 36, 0.12);
            border-color: #f9ca24;
            box-shadow: 0 0 30px rgba(249, 202, 36, 0.1);
            animation: resultPop 0.5s ease;
        }

        @keyframes resultPop {
            0% { transform: scale(0.9); opacity: 0; }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); opacity: 1; }
        }

        /* ===== БАНК 98 ===== */
        .draw-status {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            margin-bottom: 10px;
            font-size: 12px;
        }

        .draw-status .info {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .draw-status .info span {
            color: rgba(255, 255, 255, 0.5);
        }

        .draw-status .info strong {
            color: #fff;
        }

        .draw-status .info .highlight {
            color: #f9ca24;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(14, 1fr);
            gap: 3px;
            padding: 4px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            max-height: 55vh;
            overflow-y: auto;
        }

        .grid-container::-webkit-scrollbar {
            width: 3px;
        }

        .grid-container::-webkit-scrollbar-thumb {
            background: rgba(145, 70, 255, 0.2);
            border-radius: 10px;
        }

        .grid-cell {
            aspect-ratio: 1 / 1;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 3px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            padding: 1px;
            overflow: hidden;
            min-height: 0;
            min-width: 0;
        }

        .grid-cell .cell-number {
            font-size: 6px;
            color: rgba(255, 255, 255, 0.1);
            position: absolute;
            bottom: 1px;
            right: 2px;
            font-weight: 400;
            line-height: 1;
        }

        .grid-cell .item-icon {
            font-size: 16px;
            line-height: 1.2;
        }

        .grid-cell .item-name {
            font-size: 5px;
            color: rgba(255, 255, 255, 0.15);
            text-align: center;
            max-width: 90%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            line-height: 1.2;
        }

        .grid-cell.eliminated {
            background: rgba(255, 0, 0, 0.02);
            border-color: rgba(255, 0, 0, 0.02);
            transform: scale(0.6);
            opacity: 0.05;
            transition: all 0.3s ease;
        }

        .grid-cell.eliminated .item-icon,
        .grid-cell.eliminated .item-name,
        .grid-cell.eliminated .cell-number {
            opacity: 0.1;
        }

        .grid-cell.winner {
            background: rgba(249, 202, 36, 0.15);
            border-color: #f9ca24;
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(249, 202, 36, 0.15);
            animation: winnerPulse 0.8s ease-in-out infinite alternate;
            z-index: 2;
        }

        .grid-cell.winner .item-icon {
            animation: bounce 0.8s ease-in-out infinite alternate;
        }

        @keyframes winnerPulse {
            0% { box-shadow: 0 0 10px rgba(249, 202, 36, 0.1); transform: scale(1.05); }
            100% { box-shadow: 0 0 30px rgba(249, 202, 36, 0.25); transform: scale(1.15); }
        }

        @keyframes bounce {
            0% { transform: translateY(0); }
            100% { transform: translateY(-3px); }
        }

        /* ===== МОДАЛКА ПОБЕДИТЕЛЯ ===== */
        .winner-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(20px);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.4s ease;
        }

        .winner-modal.active {
            display: flex;
        }

        .winner-modal-content {
            text-align: center;
            padding: 40px 60px;
            background: radial-gradient(circle at center, rgba(145, 70, 255, 0.15) 0%, transparent 70%);
            border-radius: 32px;
            border: 2px solid rgba(249, 202, 36, 0.2);
            box-shadow: 0 0 60px rgba(249, 202, 36, 0.1);
            animation: winnerPop 0.5s ease;
            position: relative;
            max-width: 90vw;
        }

        @keyframes winnerPop {
            0% { transform: scale(0.5) rotate(-5deg); opacity: 0; }
            60% { transform: scale(1.05) rotate(1deg); }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        .winner-emoji {
            font-size: 64px;
            animation: bounce 1s infinite;
        }

        .winner-title {
            font-size: 36px;
            font-weight: 900;
            background: linear-gradient(135deg, #f9ca24, #f0932b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 15px 0 5px;
            letter-spacing: 3px;
        }

        .winner-name {
            font-size: 40px;
            font-weight: 700;
            color: #fff;
            margin: 10px 0;
            text-shadow: 0 0 30px rgba(145, 70, 255, 0.2);
        }

        .winner-sub {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 5px;
        }

        .winner-close-btn {
            position: absolute;
            top: 15px;
            right: 25px;
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.2);
            font-size: 24px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .winner-close-btn:hover {
            color: #fff;
            transform: rotate(90deg);
        }

        /* ===== КОНФЕТТИ ===== */
        @keyframes confettiFall {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
        }

        /* ===== АДАПТИВ ===== */
        @media (max-width: 768px) {
            body { padding: 5px; }
            .card { padding: 10px; }
            .wheel-wrapper { width: 220px; height: 220px; }
            .wheel-result { font-size: 18px; padding: 8px 16px; min-height: 40px; }
            .grid-container { max-height: 45vh; }
            .grid-cell .item-icon { font-size: 12px; }
            .participants-grid { grid-template-columns: repeat(auto-fill, minmax(60px, 1fr)); }
            .participant-chip { font-size: 10px; padding: 4px 8px; }
            .winner-modal-content { padding: 30px 20px; }
            .winner-title { font-size: 28px; }
            .winner-name { font-size: 30px; }
            .winner-emoji { font-size: 48px; }
        }

        @media (max-width: 480px) {
            .wheel-wrapper { width: 160px; height: 160px; }
            .wheel-result { font-size: 14px; padding: 6px 12px; min-height: 32px; }
            .grid-cell .item-icon { font-size: 9px; }
            .grid-cell .cell-number { font-size: 4px; }
            .grid-container { max-height: 40vh; gap: 2px; }
            .participants-grid { grid-template-columns: repeat(auto-fill, minmax(50px, 1fr)); }
            .participant-chip { font-size: 8px; padding: 3px 6px; }
            .winner-title { font-size: 20px; }
            .winner-name { font-size: 22px; }
            .winner-emoji { font-size: 36px; }
            .winner-modal-content { padding: 20px 15px; }
        }
    </style>
</head>
<body>

    <!-- ===== ВКЛАДКИ ОВЕРЛЕЯ ===== -->
    <div class="overlay-tabs" id="overlayTabs">
        <button class="overlay-tab-btn active" data-tab="tab1">🎯 Ключевое слово</button>
        <button class="overlay-tab-btn" data-tab="tab2">🎡 Колесо</button>
        <button class="overlay-tab-btn" data-tab="tab3">🏆 Банк 98</button>
    </div>

    <!-- ========================================= -->
    <!-- ===== ВКЛАДКА 1: КЛЮЧЕВОЕ СЛОВО ===== -->
    <!-- ========================================= -->
    <div class="tab-content active" id="tab1">
        <div class="card">
            <div class="card-title">
                <span class="icon">🎯</span>
                Розыгрыш по ключевому слову
                <span style="margin-left:auto; font-size:12px; color:rgba(255,255,255,0.3);" id="keywordStatus">Остановлен</span>
            </div>
            <div style="display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px;">
                <span class="participant-count">Участников: <strong id="participantCount">0</strong></span>
                <span class="participant-count">Кодовое слово: <strong id="displayKeyword">!лут</strong></span>
            </div>
            <div class="participants-grid" id="participantsGrid">
                <div style="grid-column:1/-1; text-align:center; color:rgba(255,255,255,0.2); padding:20px; font-size:12px;">
                    Ожидаем участников 😴
                </div>
            </div>
        </div>
    </div>

    <!-- ========================================= -->
    <!-- ===== ВКЛАДКА 2: КОЛЕСО ФОРТУНЫ ===== -->
    <!-- ========================================= -->
    <div class="tab-content" id="tab2">
        <div class="card">
            <div class="card-title">
                <span class="icon">🎡</span>
                Колесо фортуны
            </div>
            <div class="wheel-wrapper">
                <canvas id="wheelCanvas" width="600" height="600"></canvas>
            </div>
            <div class="wheel-result" id="wheelResult">🎡 Ожидание</div>
        </div>
    </div>

    <!-- ========================================= -->
    <!-- ===== ВКЛАДКА 3: БАНК 98 ===== -->
    <!-- ========================================= -->
    <div class="tab-content" id="tab3">
        <div class="card">
            <div class="card-title">
                <span class="icon">🏆</span>
                Банк 98
                <span style="font-size:11px; color:rgba(255,255,255,0.3); margin-left:auto;">
                    🎲 98 ячеек
                </span>
            </div>
            <div class="draw-status">
                <div class="info">
                    <span>✅ Активных: <strong id="activeCells">98</strong></span>
                    <span>❌ Выбыло: <strong id="eliminatedCells">0</strong></span>
                    <span>🏆 Победитель: <strong id="winnerDisplay" style="color:rgba(255,255,255,0.3);">—</strong></span>
                </div>
            </div>
            <div class="grid-container" id="bankGrid">
                <!-- Ячейки генерируются JS -->
            </div>
        </div>
    </div>

    <!-- ===== МОДАЛКА ПОБЕДИТЕЛЯ ===== -->
    <div class="winner-modal" id="winnerModal">
        <div class="winner-modal-content">
            <div class="winner-emoji">🏆</div>
            <div class="winner-title">ПОБЕДИТЕЛЬ!</div>
            <div class="winner-name" id="winnerModalName">Игрок</div>
            <div class="winner-sub" id="winnerModalSub">🎉 Поздравляем!</div>
            <button class="winner-close-btn" id="closeWinnerBtn">✕</button>
        </div>
    </div>

    <!-- ========================================= -->
    <!-- ===== JAVASCRIPT ===== -->
    <!-- ========================================= -->
    <script>
        // ==========================================
        // 0. ХРАНИЛИЩЕ ДАННЫХ (localStorage)
        // ==========================================

        const STORAGE_KEY = 'streamer_hub_state';

        function loadState() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    const parsed = JSON.parse(saved);
                    // Обновляем состояние из сохранённых данных
                    if (parsed.keyword) {
                        state.keyword = parsed.keyword;
                    }
                    if (parsed.wheel) {
                        state.wheel.sectors = parsed.wheel.sectors || state.wheel.sectors;
                        state.wheel.currentRotation = parsed.wheel.currentRotation || 0;
                    }
                    if (parsed.bank) {
                        state.bank.items = parsed.bank.items || [];
                        state.bank.winnerIndex = parsed.bank.winnerIndex || -1;
                        state.bank.eliminated = parsed.bank.eliminated || [];
                        state.bank.revealed = parsed.bank.revealed || false;
                    }
                    console.log('📂 Загружено состояние из localStorage');
                }
            } catch (e) {
                console.warn('Ошибка загрузки состояния:', e);
            }
        }

        function saveState() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify({
                    keyword: state.keyword,
                    wheel: {
                        sectors: state.wheel.sectors,
                        currentRotation: state.wheel.currentRotation,
                    },
                    bank: {
                        items: state.bank.items,
                        winnerIndex: state.bank.winnerIndex,
                        eliminated: state.bank.eliminated,
                        revealed: state.bank.revealed,
                    }
                }));
            } catch (e) {
                console.warn('Ошибка сохранения состояния:', e);
            }
        }

        // ==========================================
        // 1. СОСТОЯНИЕ
        // ==========================================

        const state = {
            keyword: {
                active: false,
                currentKeyword: '!лут',
                participants: [],
            },
            wheel: {
                sectors: [
                    { label: '1000 голды', weight: 3, color: '#ff6b6b' },
                    { label: '500 голды', weight: 5, color: '#feca57' },
                    { label: '200 голды', weight: 8, color: '#48dbfb' },
                    { label: 'Питомец', weight: 2, color: '#ff9ff3' },
                    { label: 'Ничего', weight: 4, color: '#8395a7' },
                ],
                currentRotation: 0,
                isSpinning: false,
            },
            bank: {
                items: [],
                winnerIndex: -1,
                eliminated: [],
                isRunning: false,
                revealed: false,
            }
        };

        // Загружаем сохранённое состояние
        loadState();

        // ==========================================
        // 2. ВКЛАДКИ ОВЕРЛЕЯ
        // ==========================================

        document.querySelectorAll('.overlay-tab-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.overlay-tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                this.classList.add('active');
                document.getElementById(this.dataset.tab).classList.add('active');

                if (this.dataset.tab === 'tab2') {
                    drawWheel();
                }
                if (this.dataset.tab === 'tab3') {
                    renderBankGrid();
                }
            });
        });

        // ==========================================
        // 3. МЕХАНИКА 1: КЛЮЧЕВОЕ СЛОВО
        // ==========================================

        const participantsGrid = document.getElementById('participantsGrid');
        const participantCount = document.getElementById('participantCount');
        const keywordStatus = document.getElementById('keywordStatus');
        const displayKeyword = document.getElementById('displayKeyword');

        function renderParticipants() {
            const list = state.keyword.participants;
            participantCount.textContent = list.length;
            displayKeyword.textContent = state.keyword.currentKeyword;
            keywordStatus.textContent = state.keyword.active ? '🟢 Активен' : '🔴 Остановлен';
            keywordStatus.style.color = state.keyword.active ? '#00ff64' : '#ff4757';

            if (list.length === 0) {
                participantsGrid.innerHTML = `
                    <div style="grid-column:1/-1; text-align:center; color:rgba(255,255,255,0.2); padding:20px; font-size:12px;">
                        Ожидаем участников 😴
                    </div>
                `;
                return;
            }

            participantsGrid.innerHTML = list.map(name => `<div class="participant-chip">${name}</div>`).join('');
            saveState();
        }

        // ==========================================
        // 4. МЕХАНИКА 2: КОЛЕСО ФОРТУНЫ
        // ==========================================

        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        const wheelResult = document.getElementById('wheelResult');
        const defaultColors = ['#ff6b6b', '#feca57', '#48dbfb', '#ff9ff3', '#54a0ff', '#5f27cd', '#1dd1a1', '#f368e0', '#00d2d3',
            '#ff9f43', '#10ac84', '#ee5a24'
        ];

        function drawWheel() {
            const sectors = state.wheel.sectors;
            if (sectors.length === 0) {
                ctx.clearRect(0, 0, 600, 600);
                ctx.fillStyle = 'rgba(255,255,255,0.05)';
                ctx.beginPath();
                ctx.arc(300, 300, 250, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = 'rgba(255,255,255,0.15)';
                ctx.font = '20px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('Нет секторов', 300, 300);
                return;
            }
            const totalWeight = sectors.reduce((sum, s) => sum + s.weight, 0);
            let startAngle = state.wheel.currentRotation;
            ctx.clearRect(0, 0, 600, 600);
            sectors.forEach((sector, i) => {
                const sliceAngle = (sector.weight / totalWeight) * Math.PI * 2;
                const endAngle = startAngle + sliceAngle;
                ctx.beginPath();
                ctx.moveTo(300, 300);
                ctx.arc(300, 300, 280, startAngle, endAngle);
                ctx.closePath();
                ctx.fillStyle = sector.color || defaultColors[i % defaultColors.length];
                ctx.fill();
                ctx.strokeStyle = 'rgba(255,255,255,0.05)';
                ctx.lineWidth = 2;
                ctx.stroke();
                const midAngle = startAngle + sliceAngle / 2;
                const textRadius = 200;
                const x = 300 + Math.cos(midAngle) * textRadius;
                const y = 300 + Math.sin(midAngle) * textRadius;
                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(midAngle + (midAngle > Math.PI / 2 ? Math.PI : 0));
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 16px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.shadowColor = 'rgba(0,0,0,0.5)';
                ctx.shadowBlur = 4;
                const label = sector.label.length > 12 ? sector.label.slice(0, 10) + '…' : sector.label;
                ctx.fillText(label, 0, 0);
                ctx.restore();
                startAngle = endAngle;
            });
            ctx.beginPath();
            ctx.arc(300, 300, 280, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(255,255,255,0.08)';
            ctx.lineWidth = 3;
            ctx.stroke();
            ctx.fillStyle = '#ff4757';
            ctx.shadowColor = 'rgba(255,71,87,0.3)';
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.moveTo(300, 10);
            ctx.lineTo(285, 30);
            ctx.lineTo(315, 30);
            ctx.closePath();
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.fillStyle = 'rgba(255,255,255,0.1)';
            ctx.beginPath();
            ctx.arc(300, 35, 4, 0, Math.PI * 2);
            ctx.fill();
            saveState();
        }

        // ==========================================
        // 5. МЕХАНИКА 3: БАНК 98
        // ==========================================

        const bankGrid = document.getElementById('bankGrid');
        const activeCells = document.getElementById('activeCells');
        const eliminatedCells = document.getElementById('eliminatedCells');
        const winnerDisplay = document.getElementById('winnerDisplay');

        const itemIcons = ['⚔️', '🛡️', '💎', '👑', '🏹', '🗡️', '🔮', '🧙', '🐉', '🔥', '❄️', '⚡', '🌿', '💀', '🦴', '🍀', '🌟', '🌈', '🎯',
            '🏆', '💍', '🧪', '📜', '🪄'
        ];

        const itemNames = ['Меч', 'Щит', 'Алмаз', 'Корона', 'Лук', 'Кинжал', 'Кристалл', 'Посох', 'Дракон', 'Огонь', 'Лед', 'Молния',
            'Зелье', 'Череп', 'Кость', 'Клевер', 'Звезда', 'Радуга', 'Мишень', 'Трофей', 'Кольцо', 'Эликсир', 'Свиток', 'Жезл'
        ];

        function generateBankItems() {
            const items = [];
            for (let i = 0; i < 98; i++) {
                const idx = Math.floor(Math.random() * itemIcons.length);
                items.push({
                    id: i,
                    icon: itemIcons[idx],
                    name: itemNames[idx],
                });
            }
            return items;
        }

        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function renderBankGrid() {
            const items = state.bank.items;
            if (items.length === 0) {
                state.bank.items = generateBankItems();
                shuffleArray(state.bank.items);
                state.bank.eliminated = [];
                state.bank.winnerIndex = -1;
                state.bank.revealed = false;
            }

            const active = items.length - state.bank.eliminated.length;
            activeCells.textContent = active;
            eliminatedCells.textContent = state.bank.eliminated.length;

            if (state.bank.revealed && state.bank.winnerIndex >= 0) {
                winnerDisplay.textContent = `#${state.bank.winnerIndex + 1}`;
                winnerDisplay.style.color = '#f9ca24';
            } else {
                winnerDisplay.textContent = '—';
                winnerDisplay.style.color = 'rgba(255,255,255,0.3)';
            }

            bankGrid.innerHTML = items.map((item, index) => {
                const isEliminated = state.bank.eliminated.includes(index);
                const isWinner = state.bank.revealed && index === state.bank.winnerIndex;
                let classes = 'grid-cell';
                if (isEliminated) classes += ' eliminated';
                if (isWinner) classes += ' winner';
                return `
                    <div class="${classes}" data-index="${index}">
                        <span class="item-icon">${item.icon}</span>
                        <span class="item-name">${item.name}</span>
                        <span class="cell-number">#${index + 1}</span>
                    </div>
                `;
            }).join('');
            saveState();
        }

        // ==========================================
        // 6. СЛУШАТЕЛЬ СОБЫТИЙ (для админки)
        // ==========================================

        // Слушаем изменения localStorage от админки
        window.addEventListener('storage', function(e) {
            if (e.key === STORAGE_KEY && e.newValue) {
                try {
                    const data = JSON.parse(e.newValue);
                    console.log('📥 Получено обновление из админки:', data);

                    // Обновляем состояние
                    if (data.keyword) {
                        state.keyword = data.keyword;
                    }
                    if (data.wheel) {
                        state.wheel.sectors = data.wheel.sectors || state.wheel.sectors;
                        state.wheel.currentRotation = data.wheel.currentRotation || 0;
                    }
                    if (data.bank) {
                        state.bank.items = data.bank.items || [];
                        state.bank.winnerIndex = data.bank.winnerIndex || -1;
                        state.bank.eliminated = data.bank.eliminated || [];
                        state.bank.revealed = data.bank.revealed || false;
                    }

                    // Перерисовываем UI
                    renderParticipants();
                    drawWheel();
                    renderBankGrid();

                    // Если есть победитель в банке — показываем модалку
                    if (state.bank.revealed && state.bank.winnerIndex >= 0) {
                        const winner = state.bank.items[state.bank.winnerIndex];
                        if (winner) {
                            document.getElementById('winnerModalName').textContent = `${winner.icon} #${state.bank.winnerIndex + 1}`;
                            document.getElementById('winnerModalSub').textContent = `🎉 ${winner.icon} ${winner.name}!`;
                            document.getElementById('winnerModal').classList.add('active');
                            createConfetti();
                        }
                    }

                    // Если есть победитель в ключевом слове — показываем модалку
                    if (data.showWinner) {
                        document.getElementById('winnerModalName').textContent = data.showWinner;
                        document.getElementById('winnerModalSub').textContent = '🎉 Поздравляем!';
                        document.getElementById('winnerModal').classList.add('active');
                        createConfetti();
                    }

                } catch (e) {
                    console.warn('Ошибка обработки события storage:', e);
                }
            }
        });

        // ==========================================
        // 7. КОНФЕТТИ
        // ==========================================

        function createConfetti() {
            const colors = ['#ff6b6b', '#feca57', '#48dbfb', '#ff9ff3', '#54a0ff', '#f9ca24', '#ff4757', '#00d4ff'];
            for (let i = 0; i < 40; i++) {
                const confetti = document.createElement('div');
                confetti.style.cssText = `
                    position: fixed;
                    width: ${6 + Math.random() * 8}px;
                    height: ${6 + Math.random() * 8}px;
                    background: ${colors[Math.floor(Math.random() * colors.length)]};
                    left: ${Math.random() * 100}vw;
                    top: -20px;
                    border-radius: ${Math.random() > 0.5 ? '50%' : '2px'};
                    animation: confettiFall ${2 + Math.random() * 3}s linear forwards;
                    animation-delay: ${Math.random() * 0.5}s;
                    z-index: 2001;
                    pointer-events: none;
                    transform: rotate(${Math.random() * 360}deg);
                `;
                document.body.appendChild(confetti);
                setTimeout(() => confetti.remove(), 5000);
            }
        }

        // ==========================================
        // 8. ЗАКРЫТИЕ МОДАЛКИ
        // ==========================================

        document.getElementById('closeWinnerBtn').addEventListener('click', function() {
            document.getElementById('winnerModal').classList.remove('active');
        });

        document.getElementById('winnerModal').addEventListener('click', function(e) {
            if (e.target === this) {
                this.classList.remove('active');
            }
        });

        // ==========================================
        // 9. ИНИЦИАЛИЗАЦИЯ
        // ==========================================

        renderParticipants();
        drawWheel();
        renderBankGrid();

        console.log('🎬 Оверлей загружен!');
        console.log('📦 Состояние:', state);
        console.log('🔄 Слушаем изменения localStorage (ключ: streamer_hub_state)');

        // Экспорт для отладки
        window.state = state;
        window.renderParticipants = renderParticipants;
        window.drawWheel = drawWheel;
        window.renderBankGrid = renderBankGrid;
    </script>

</body>
</html>
