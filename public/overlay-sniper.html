<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<title>Оверлей | Снайпер</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: transparent !important;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 20px; overflow: hidden;
  }
  .overlay {
    max-width: 900px; width: 100%;
    padding: 20px; background: rgba(0,0,0,0.85);
    backdrop-filter: blur(12px); border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.04);
    position: relative;
    transition: opacity 0.3s ease;
  }
  .overlay:not(.active) {
    opacity: 0;
    pointer-events: none;
  }
  .overlay.active {
    opacity: 1;
    pointer-events: auto;
  }

  .stats { display: flex; justify-content: center; gap: 30px; margin-bottom: 16px;
           font-size: 14px; color: rgba(255,255,255,0.5); }
  .stats strong { color: #fff; }
  .stats .alive strong { color: #00ff64; }
  .stats .dead strong { color: #ff4757; }

  .arena { display: flex; flex-wrap: wrap; gap: 4px; padding: 12px;
           min-height: 80px; max-height: 60vh; overflow-y: auto;
           background: rgba(255,255,255,0.02); border-radius: 12px;
           border: 1px solid rgba(255,255,255,0.04); justify-content: center;
           position: relative; }
  .chip {
    display: inline-flex; align-items: center; padding: 4px 12px;
    border-radius: 16px; background: rgba(255,255,255,0.04);
    border: 2px solid rgba(255,255,255,0.06);
    font-size: 13px; font-weight: 500; color: rgba(255,255,255,0.7);
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    white-space: nowrap; height: 32px; position: relative;
    z-index: 1;
  }
  .chip.eliminated {
    opacity: 0.4; transform: scale(0.9); text-decoration: line-through;
    color: rgba(255,255,255,0.3);
  }
  .chip.targeted {
    border-color: #ff4757;
    background: rgba(255,71,87,0.15);
    color: #fff;
    z-index: 2;
  }
  .chip.shot {
    animation: shotEffect 0.9s ease-out forwards;
  }
  @keyframes shotEffect {
    0% {
      border-color: #ff4757;
      box-shadow: 0 0 60px rgba(255,71,87,0.5);
      transform: scale(1.2);
    }
    35% {
      border-color: #ff4757;
      box-shadow: 0 0 120px rgba(255,71,87,0.9);
      transform: scale(1.4);
    }
    100% {
      opacity: 0.4;
      transform: scale(0.9);
    }
  }

  .crosshair {
    position: fixed;
    top: 0; left: 0;
    width: 32px;
    height: 32px;
    pointer-events: none;
    z-index: 100;
    transform: translate(-50%, -50%);
    will-change: transform;
    display: none;
  }
  .crosshair.active { display: block; }

  .crosshair svg {
    width: 100%;
    height: 100%;
    filter: drop-shadow(0 0 6px rgba(255,71,87,0.9));
  }

  .crosshair::after {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    width: 4px; height: 4px;
    border-radius: 50%;
    background: #ff4757;
    box-shadow: 0 0 12px rgba(255,71,87,1), 0 0 24px rgba(255,71,87,0.6);
    transform: translate(-50%, -50%);
  }

  .crosshair.locked::after {
    animation: lockPulse 0.5s ease-in-out infinite;
  }
  @keyframes lockPulse {
    0%, 100% { transform: translate(-50%, -50%) scale(1); }
    50% { transform: translate(-50%, -50%) scale(1.6); }
  }

  .flash {
    position: fixed; inset: 0; pointer-events: none; z-index: 999;
    background: radial-gradient(circle at center, rgba(255,71,87,0.45), transparent 70%);
    animation: flashBang 0.35s ease-out forwards;
  }
  @keyframes flashBang {
    0% { opacity: 1; transform: scale(0.5); }
    100% { opacity: 0; transform: scale(2.5); }
  }

  .victim-banner {
    position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: linear-gradient(135deg, rgba(180,20,30,0.85), rgba(120,10,20,0.9));
    border: 1px solid rgba(255,71,87,0.3); border-radius: 12px;
    padding: 12px 30px; font-size: 24px; font-weight: 700; color: #fff;
    animation: victimAppear 0.3s ease-out; z-index: 5; white-space: nowrap;
  }
  .victim-banner.hidden { display: none; }
  @keyframes victimAppear {
    0% { transform: translateX(-50%) scale(0.5) translateY(20px); opacity: 0; }
    100% { transform: translateX(-50%) scale(1) translateY(0); opacity: 1; }
  }
</style>
</head>
<body>

<audio id="shotSound" preload="auto"><source src="/sounds/shot.mp3" type="audio/mpeg"></audio>

<div class="overlay" id="ov">
  <div class="stats">
    <span class="alive">🟢 Живых: <strong id="alive">0</strong></span>
    <span class="dead">💀 Выбыло: <strong id="dead">0</strong></span>
    <span>👥 Всего: <strong id="total">0</strong></span>
  </div>
  <div class="arena" id="arena"></div>
  <div class="victim-banner hidden" id="banner">💀 Жертва</div>
</div>

<div class="crosshair" id="crosshair">
  <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
    <circle cx="16" cy="16" r="12" fill="none" stroke="#ff4757" stroke-width="1.5" opacity="0.85"/>
    <line x1="16" y1="0" x2="16" y2="6" stroke="#ff4757" stroke-width="2" stroke-linecap="round"/>
    <line x1="16" y1="26" x2="16" y2="32" stroke="#ff4757" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="16" x2="6" y2="16" stroke="#ff4757" stroke-width="2" stroke-linecap="round"/>
    <line x1="26" y1="16" x2="32" y2="16" stroke="#ff4757" stroke-width="2" stroke-linecap="round"/>
  </svg>
</div>

<script>
const ov = document.getElementById('ov');
const arena = document.getElementById('arena');
const aliveEl = document.getElementById('alive');
const deadEl = document.getElementById('dead');
const totalEl = document.getElementById('total');
const banner = document.getElementById('banner');
const shotSound = document.getElementById('shotSound');
const crosshair = document.getElementById('crosshair');

let participants = [];
let targetingId = null;
let aimFrame = null;
let hideTimer = null;
let isShooting = false;
let _loggedLock = false;
let _serverAimDuration = 2500;

function hideCrosshair() {
  crosshair.classList.remove('active', 'locked');
}

function moveCrosshair(x, y) {
  crosshair.style.transform = `translate(${x}px, ${y}px) translate(-50%, -50%)`;
}

function stopAiming() {
  if (aimFrame) {
    cancelAnimationFrame(aimFrame);
    aimFrame = null;
  }
  isShooting = false;
  crosshair.classList.remove('locked');
}

function render() {
  const alive = participants.filter(p => p.alive).length;
  const dead = participants.length - alive;
  aliveEl.textContent = alive;
  deadEl.textContent = dead;
  totalEl.textContent = participants.length;

  if (participants.length === 0) {
    arena.innerHTML = `<div style="width:100%;text-align:center;color:rgba(255,255,255,0.15);padding:30px;font-size:14px;">Ожидание участников...</div>`;
    return;
  }

  const sorted = [...participants].sort((a, b) => {
    if (a.alive && !b.alive) return -1;
    if (!a.alive && b.alive) return 1;
    return a.id - b.id;
  });

  arena.innerHTML = sorted.map(p => {
    const targeted = targetingId === p.id && p.alive;
    const cls = `chip ${p.alive ? '' : 'eliminated'} ${targeted ? 'targeted' : ''}`;
    return `<div class="${cls}" data-id="${p.id}">#${p.id} ${escapeHtml(p.name)}${p.alive ? '' : ' 💀'}</div>`;
  }).join('');
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function showBanner(name) {
  banner.textContent = `💀 ${name}`;
  banner.classList.remove('hidden');
  setTimeout(() => banner.classList.add('hidden'), 2500);
}

function flash() {
  const el = document.createElement('div');
  el.className = 'flash';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 400);
}

function catmullRom(p0, p1, p2, p3, t) {
  const t2 = t * t;
  const t3 = t2 * t;
  return {
    x: 0.5 * (
      (2 * p1.x) +
      (-p0.x + p2.x) * t +
      (2 * p0.x - 5 * p1.x + 4 * p2.x - p3.x) * t2 +
      (-p0.x + 3 * p1.x - 3 * p2.x + p3.x) * t3
    ),
    y: 0.5 * (
      (2 * p1.y) +
      (-p0.y + p2.y) * t +
      (2 * p0.y - 5 * p1.y + 4 * p2.y - p3.y) * t2 +
      (-p0.y + 3 * p1.y - 3 * p2.y + p3.y) * t3
    ),
  };
}

// === Анимация прицеливания ===
function runAim(victimId) {
  stopAiming();
  hideCrosshair();
  _loggedLock = false;

  console.log('[sniper] ========== runAim START ==========');
  console.log('[sniper] victimId =', victimId, 'aimDuration =', _serverAimDuration);

  const alive = participants.filter(p => p.alive);
  if (alive.length <= 1) {
    console.warn('[sniper] runAim: недостаточно живых');
    return;
  }

  const victimChip = arena.querySelector(`.chip[data-id="${victimId}"]`);
  if (!victimChip) {
    console.warn('[sniper] runAim: плашка жертвы не найдена');
    return;
  }

  isShooting = true;
  crosshair.classList.add('active');

  const liveChips = [...arena.querySelectorAll('.chip:not(.eliminated)')];

  // Точка внутри плашки — случайная, но чуть ближе к центру
  function pointIn(chip) {
    const rect = chip.getBoundingClientRect();
    return {
      x: rect.left + rect.width * (0.2 + Math.random() * 0.6),
      y: rect.top + rect.height * (0.2 + Math.random() * 0.6),
    };
  }

  // === Строим точки траектории ===
  // Начинаем со случайной точки внутри случайной плашки (не жертвы).
  // Дальше — перемешиваем все живые плашки и добавляем по одной случайной точке
  // внутри каждой. Заканчиваем финальной точкой внутри плашки жертвы.

  const liveChipsWithoutVictim = liveChips.filter(
    c => Number(c.dataset.id) !== Number(victimId)
  );

  // Перемешиваем плашки случайно
  const shuffled = [...liveChipsWithoutVictim].sort(() => Math.random() - 0.5);

  // Стартовая точка — внутри первой плашки
  const startChip = shuffled[0] || victimChip;
  const startPoint = pointIn(startChip);

  // Точки промежуточные — по одной внутри каждой оставшейся плашки
  const midPoints = shuffled.slice(1).map(chip => pointIn(chip));

  // Финальная точка — внутри плашки жертвы
  const finalPoint = pointIn(victimChip);

  const points = [startPoint, ...midPoints, finalPoint];

  console.log('[sniper] точек в траектории:', points.length);

  // === Тайминги ===
  const BUFFER = 400;
  const totalDuration = Math.max(1500, _serverAimDuration - BUFFER);
  const startTime = performance.now();

  // === Catmull-Rom позиция ===
  // Интерполирует точку между p1 и p2 по параметру t (0..1).
  // p0 и p3 — соседи для расчёта наклона.
  function catmullRom(p0, p1, p2, p3, t) {
    const t2 = t * t;
    const t3 = t2 * t;
    return {
      x: 0.5 * (
        (2 * p1.x) +
        (-p0.x + p2.x) * t +
        (2 * p0.x - 5 * p1.x + 4 * p2.x - p3.x) * t2 +
        (-p0.x + 3 * p1.x - 3 * p2.x + p3.x) * t3
      ),
      y: 0.5 * (
        (2 * p1.y) +
        (-p0.y + p2.y) * t +
        (2 * p0.y - 5 * p1.y + 4 * p2.y - p3.y) * t2 +
        (-p0.y + 3 * p1.y - 3 * p2.y + p3.y) * t3
      ),
    };
  }

  // Квантизованные индексы с зажимом
  function clampIdx(i, len) {
    return Math.max(0, Math.min(len - 1, i));
  }

  // === Анимационный цикл ===
  function step(now) {
    if (!isShooting) return;

    const elapsed = now - startTime;
    const progress = Math.min(elapsed / totalDuration, 1);

    // === Easing ===
    // Мягкий старт, плавное движение, плавное торможение.
    // easeInOutSine — самая «естественная» кривая, без ускорений в середине.
    const eased = 0.5 - Math.cos(Math.PI * progress) / 2;

    // === Интерполяция по кривой Catmull-Rom ===
    // Разбиваем [0..1] на (points.length - 1) сегментов.
    const totalSegments = points.length - 1;
    const scaledT = eased * totalSegments;
    const segIndex = Math.min(Math.floor(scaledT), totalSegments - 1);
    const segT = scaledT - segIndex;

    const p0 = points[clampIdx(segIndex - 1, points.length)];
    const p1 = points[segIndex];
    const p2 = points[segIndex + 1];
    const p3 = points[clampIdx(segIndex + 2, points.length)];

    const pos = catmullRom(p0, p1, p2, p3, segT);

    // === Микро-дрожание в конце ===
    // Даёт эффект «дыхания» прицела на финальной наводке.
    // Амплитуда затухает до нуля к самому концу.
    let trembleX = 0;
    let trembleY = 0;
    if (progress > 0.75) {
      const trembleAmount = (1 - progress) * 12; // до 12 пикселей
      const phase = elapsed * 0.015;
      trembleX = Math.sin(phase) * trembleAmount;
      trembleY = Math.cos(phase * 1.3) * trembleAmount;
    }

    moveCrosshair(pos.x + trembleX, pos.y + trembleY);

    // === Пульсация .locked ===
    // Когда близко к финалу, но ещё летим — начинаем пульсировать.
    if (progress > 0.9) {
      crosshair.classList.add('locked');
    }

    // === Подсветка плашки под прицелом ===
    // Ищем, к какой ближайшей плашке ближе всего — подсвечиваем.
    // Делаем это раз в ~5 кадров для производительности.
    if (Math.random() < 0.2) {
      let closest = null;
      let minDist = Infinity;
      for (const chip of liveChips) {
        const r = chip.getBoundingClientRect();
        const cx = r.left + r.width / 2;
        const cy = r.top + r.height / 2;
        const dx = pos.x - cx;
        const dy = pos.y - cy;
        const d = dx * dx + dy * dy;
        if (d < minDist) {
          minDist = d;
          closest = chip;
        }
      }
      // Подсвечиваем только если прицел достаточно близко (в радиусе 60 px)
      if (closest && minDist < 3600) {
        arena.querySelectorAll('.chip.targeted').forEach(c => {
          if (c !== closest) c.classList.remove('targeted');
        });
        closest.classList.add('targeted');
      } else {
        arena.querySelectorAll('.chip.targeted').forEach(c => c.classList.remove('targeted'));
      }
    }

    if (progress < 1) {
      aimFrame = requestAnimationFrame(step);
    } else {
      // Финал — точно на finalPoint
      moveCrosshair(finalPoint.x, finalPoint.y);
      crosshair.classList.add('locked');
      arena.querySelectorAll('.chip.targeted').forEach(c => c.classList.remove('targeted'));
      const liveVictim = arena.querySelector(`.chip[data-id="${victimId}"]`);
      if (liveVictim) liveVictim.classList.add('targeted');
      console.log('[sniper] ========== runAim FINISH ==========');
      console.log('[sniper] финальная позиция =', finalPoint.x, finalPoint.y);
    }
  }

  aimFrame = requestAnimationFrame(step);
}

function connect() {
  const ws = new WebSocket(`ws://${location.host}`);
  ws.onmessage = e => {
    const { type, payload } = JSON.parse(e.data);

    if (type === 'state') {
      participants = payload.sniper.participants;
      if (participants.length > 0) ov.classList.add('active');
      render();
    }

    if (type === 'sniper:state') {
      if (isShooting && payload.status !== 'shooting') {
        stopAiming();
        hideCrosshair();
      }

      if (!isShooting) {
        participants = payload.participants;
        targetingId = payload.victimId;
        if (participants.length > 0) ov.classList.add('active');
        if (participants.length === 0) ov.classList.remove('active');
        render();
      } else {
        participants = payload.participants;
      }
    }

    if (type === 'sniper:shooting') {
      console.log('[sniper] получен sniper:shooting, victimId =', payload.victimId, 'aimDuration =', payload.aimDuration);
      _serverAimDuration = payload.aimDuration || 2500;
      participants = payload.participants;
      targetingId = null;
      ov.classList.add('active');
      render();

      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          runAim(payload.victimId);
        });
      });
    }

    if (type === 'sniper:shot') {
      console.log('[sniper] получен sniper:shot, victimId =', payload.victimId);
      stopAiming();

      const victimChip = arena.querySelector(`.chip[data-id="${payload.victimId}"]`);
      if (victimChip) {
        victimChip.classList.add('shot');
        victimChip.classList.add('targeted');
      }

      flash();
      showBanner(payload.victimName);
      shotSound.volume = 0.2;
      shotSound.currentTime = 0;
      shotSound.play().catch(() => {});

      if (hideTimer) clearTimeout(hideTimer);
      hideTimer = setTimeout(() => {
        hideCrosshair();
        hideTimer = null;
      }, 1500);

      setTimeout(() => {
        participants = payload.participants;
        targetingId = null;
        render();
      }, 1600);
    }

    if (type === 'winner:show' && payload.tag?.includes('Снайпер')) {
      stopAiming();
      hideCrosshair();
      render();
      setTimeout(() => ov.classList.remove('active'), 3000);
    }
  };
  ws.onclose = () => setTimeout(connect, 1000);
}
connect();
</script>
</body>
</html>
