<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<title>Оверлей | Топы</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: transparent !important;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px;
    color: #fff;
  }

  .tops-card {
    background: linear-gradient(135deg,
      rgba(28, 8, 8, 0.72) 0%,
      rgba(58, 12, 14, 0.72) 50%,
      rgba(28, 8, 8, 0.72) 100%);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border-radius: 16px;
    padding: 10px 16px;
    display: inline-flex;
    flex-direction: column;
    gap: 6px;
    min-width: 260px;
    max-width: 340px;

    /* Золотая обводка */
    border: 2px solid rgba(249, 202, 36, 0.75);

    /* Свечение наружу + направленное внутрь + красное свечение изнутри */
    box-shadow:
      0 0 20px rgba(249, 202, 36, 0.35),
      0 0 40px rgba(249, 202, 36, 0.15),
      inset 0 0 24px rgba(249, 202, 36, 0.15),
      inset 0 0 4px rgba(249, 202, 36, 0.4),
      inset 0 0 60px rgba(180, 20, 20, 0.18);

    position: relative;
  }

  /* Внутренняя тонкая золотая линия для усиления эффекта */
  .tops-card::before {
    content: '';
    position: absolute;
    inset: 4px;
    border-radius: 12px;
    border: 1px solid rgba(249, 202, 36, 0.2);
    pointer-events: none;
  }

  .row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 5px 8px;
    border-radius: 8px;
    background: rgba(0, 0, 0, 0.2);
    transition: background 0.3s;
  }

  .row.dj { background: rgba(180, 30, 40, 0.12); }
  .row.daily { background: rgba(249, 202, 36, 0.08); }
  .row.monthly { background: rgba(220, 40, 50, 0.10); }

  .row .emoji {
    font-size: 18px;
    line-height: 1;
    flex-shrink: 0;
  }

  .row .info {
    display: flex;
    flex-direction: column;
    gap: 1px;
    min-width: 0;
    flex: 1;
  }

  .row .label {
    font-size: 9px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: rgba(249, 202, 36, 0.65);
    line-height: 1;
    font-weight: 600;
  }

  .row .value {
    font-size: 14px;
    font-weight: 700;
    color: #fff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.2;
  }

  .row .value .points {
    font-size: 12px;
    color: #f9ca24;
    margin-left: 6px;
    font-weight: 600;
    text-shadow: 0 0 6px rgba(249, 202, 36, 0.4);
  }

  .row .empty-value {
    color: rgba(255, 255, 255, 0.3);
    font-weight: 400;
    font-style: italic;
  }

  /* Пульсация при смене лидера */
  .row.bump {
    animation: rowBump 0.6s ease;
  }
  @keyframes rowBump {
    0%   { transform: scale(1);    box-shadow: 0 0 0 0 rgba(249, 202, 36, 0.6); }
    50%  { transform: scale(1.03); box-shadow: 0 0 0 8px rgba(249, 202, 36, 0); }
    100% { transform: scale(1);    box-shadow: 0 0 0 0 rgba(249, 202, 36, 0); }
  }
</style>
</head>
<body>

<div class="tops-card" id="card">
  <div class="row monthly" id="rowMonthly">
    <span class="emoji">👑</span>
    <div class="info">
      <div class="label">Легенда месяца</div>
      <div class="value empty-value" id="monthlyValue">нет данных</div>
    </div>
  </div>

  <div class="row daily" id="rowDaily">
    <span class="emoji">🌟</span>
    <div class="info">
      <div class="label">Легенда дня</div>
      <div class="value empty-value" id="dailyValue">нет данных</div>
    </div>
  </div>

  <div class="row dj" id="rowDj">
    <span class="emoji">🎧</span>
    <div class="info">
      <div class="label">Диджей дня</div>
      <div class="value empty-value" id="djValue">нет данных</div>
    </div>
  </div>
</div>

<script>
const dailyValue = document.getElementById('dailyValue');
const monthlyValue = document.getElementById('monthlyValue');
const djValue = document.getElementById('djValue');
const rowDaily = document.getElementById('rowDaily');
const rowMonthly = document.getElementById('rowMonthly');
const rowDj = document.getElementById('rowDj');

// === Единый кэш состояния ===
const cache = {
  tops: null,
  dj: null,
};

let lastDailyName = null;
let lastMonthlyName = null;
let lastDjName = null;

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function bumpRow(row) {
  row.classList.remove('bump');
  void row.offsetWidth;
  row.classList.add('bump');
}

function renderText(el, name, value, suffix = '₽') {
  if (!name) {
    el.classList.add('empty-value');
    el.textContent = 'нет данных';
    return;
  }
  el.classList.remove('empty-value');
  el.innerHTML = `${escapeHtml(name)}<span class="points">${value} ${suffix}</span>`;
}

// === Рендер всей карточки из кэша ===
function renderAll() {
  // --- Monthly ---
  if (cache.tops) {
    const monthlyLeader = cache.tops.monthly?.leader;
    if (monthlyLeader) {
      renderText(monthlyValue, monthlyLeader.name, monthlyLeader.totalAmount || 0);
      if (lastMonthlyName && lastMonthlyName !== monthlyLeader.name) bumpRow(rowMonthly);
      lastMonthlyName = monthlyLeader.name;
    } else {
      renderText(monthlyValue, null);
      lastMonthlyName = null;
    }

    // --- Daily ---
    const dailyLeader = cache.tops.daily?.leader;
    if (dailyLeader) {
      renderText(dailyValue, dailyLeader.name, dailyLeader.totalAmount || 0);
      if (lastDailyName && lastDailyName !== dailyLeader.name) bumpRow(rowDaily);
      lastDailyName = dailyLeader.name;
    } else {
      renderText(dailyValue, null);
      lastDailyName = null;
    }
  }

  // --- DJ ---
  if (cache.dj) {
    const djLeader = cache.dj.leader;
    if (djLeader) {
      renderText(djValue, djLeader.username, djLeader.points || 0, 'баллов');
      if (lastDjName && lastDjName !== djLeader.username) bumpRow(rowDj);
      lastDjName = djLeader.username;
    } else {
      renderText(djValue, null);
      lastDjName = null;
    }
  }
}

function connect() {
  const ws = new WebSocket(`ws://${location.host}`);
  ws.onmessage = (e) => {
    const { type, payload } = JSON.parse(e.data);

    if (type === 'state') {
      cache.tops = payload.tops || null;
      cache.dj = payload.dj || null;
      renderAll();
      return;
    }

    if (type === 'tops:state') {
      cache.tops = payload;
      renderAll();
      return;
    }

    if (type === 'dj:state') {
      cache.dj = payload;
      renderAll();
      return;
    }
  };
  ws.onclose = () => setTimeout(connect, 1000);
}
connect();
</script>
</body>
</html>
