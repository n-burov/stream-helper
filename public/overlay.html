<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Overlay</title>
  <style>
    html, body { margin: 0; padding: 0; background: transparent;
                 font-family: 'Segoe UI', sans-serif; overflow: hidden; }
    #hello {
      display: none;
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%) scale(0.3);
      font-size: 96px;
      font-weight: 900;
      color: white;
      text-shadow: 0 0 20px #9147ff, 0 0 40px #9147ff, 0 0 60px #9147ff;
      opacity: 0;
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1),
                  opacity 0.3s ease;
    }
    #hello.visible {
      display: block;
      transform: translate(-50%, -50%) scale(1);
      opacity: 1;
    }
  </style>
</head>
<body>
  <div id="hello">Hello World!</div>

  <script>
    const hello = document.getElementById('hello');
    let ws;

    function connect() {
      ws = new WebSocket(`ws://${location.host}`);
      ws.onopen = () => console.log('[overlay] WS подключён');

      ws.onmessage = (e) => {
        const { type, payload } = JSON.parse(e.data);
        switch (type) {
          case 'state':
            hello.classList.toggle('visible', payload.helloVisible);
            break;
          case 'helloVisible':
            hello.classList.toggle('visible', payload);
            break;
        }
      };

      ws.onclose = () => {
        console.log('[overlay] WS отключён, реконнект через 1с');
        setTimeout(connect, 1000);
      };
    }

    connect();
  </script>
</body>
</html>
