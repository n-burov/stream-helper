<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<title>Оверлей | Колесо фортуны</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: transparent !important;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow: hidden;
  }

  .stage {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .wrap {
    display: none;
    width: 420px;
    height: 420px;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .wrap.active { display: flex; }
  .inner { width: 350px; height: 350px; position: relative; }
  #c {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    box-shadow: 0 0 60px rgba(145,70,255,0.15), 0 0 120px rgba(145,70,255,0.08);
  }

  /* === Плашка донатера (сверху) === */
  .donor-badge {
    position: absolute;
    top: -70px;
    left: 50%;
    transform: translateX(-50%) translateY(-10px);
    background: linear-gradient(135deg, rgba(0,212,255,0.95), rgba(0,140,200,0.95));
    color: #fff;
    padding: 10px 24px;
    border-radius: 14px;
    font-size: 18px;
    font-weight: 700;
    white-space: nowrap;
    box-shadow: 0 6px 30px rgba(0,212,255,0.4);
    border: 1px solid rgba(255,255,255,0.2);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s ease, transform 0.4s ease;
    z-index: 10;
  }
  .donor-badge.visible {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
  .donor-badge .icon { margin-right: 6px; }
  .donor-badge .amount {
    font-size: 13px;
    font-weight: 500;
    color: rgba(255,255,255,0.75);
    margin-left: 6px;
  }
</style>
</head>
<body>

<audio id="spinSound" preload="auto"><source src="/sounds/wheel-spin.mp3" type="audio/mpeg"></audio>

<div class="stage">
  <div class="donor-badge" id="donorBadge">
    <span class="icon">🎡</span>
    <span class="text">Донат</span>
    <span class="amount"></span>
  </div>

  <div class="wrap" id="wrap">
    <div class="inner"><canvas id="c" width="600" height="600"></canvas></div>
  </div>
</div>

<script>
const wrap = document.getElementById('wrap');
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const spinSound = document.getElementById('spinSound');
const donorBadge = document.getElementById('donorBadge');

const defaultColors = ['#ff6b6b','#feca57','#48dbfb','#ff9ff3','#54a0ff','#5f27cd','#1dd1a1','#f368e0','#00d2d3','#ff9f43','#10ac84','#ee5a24'];

let sectors = [];
let rotation = 0;
let isSpinning = false;
let currentSpinId = null;

function show() { wrap.classList.add('active'); }
function hide() {
  wrap.classList.remove('active');
  spinSound.pause(); spinSound.currentTime = 0;
  hideDonorBadge();
}

// === Показать плашку донатера ===
function showDonorBadge(name, amount) {
  if (!name) { hideDonorBadge(); return; }
  const textEl = donorBadge.querySelector('.text');
  const amountEl = donorBadge.querySelector('.amount');

  textEl.textContent = `Донат от ${name}`;
  amountEl.textContent = amount ? `(${amount} ₽)` : '';

  donorBadge.classList.add('visible');
}

function hideDonorBadge() {
  donorBadge.classList.remove('visible');
}

function draw() {
  ctx.clearRect(0, 0, 600, 600);
  if (!sectors || sectors.length === 0) return;

  const totalWeight = sectors.reduce((s, x) => s + x.weight, 0);
  let start = rotation;

  sectors.forEach((sec, i) => {
    const slice = (sec.weight / totalWeight) * Math.PI * 2;
    const end = start + slice;

    ctx.beginPath();
    ctx.moveTo(300, 300);
    ctx.arc(300, 300, 280, start, end);
    ctx.closePath();
    ctx.fillStyle = sec.color || defaultColors[i % defaultColors.length];
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.06)';
    ctx.lineWidth = 1;
    ctx.stroke();

    const mid = start + slice / 2;
    const x = 300 + Math.cos(mid) * 195;
    const y = 300 + Math.sin(mid) * 195;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(mid + (mid > Math.PI / 2 ? Math.PI : 0));
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 14px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = 'rgba(0,0,0,0.5)';
    ctx.shadowBlur = 3;
    ctx.fillText(sec.label.slice(0, 10), 0, 0);
    ctx.restore();

    start = end;
  });

  ctx.beginPath();
  ctx.arc(300, 300, 280, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(255,255,255,0.08)';
  ctx.lineWidth = 2;
  ctx.stroke();

  // Стрелка
  ctx.fillStyle = '#ff4757';
  ctx.shadowColor = 'rgba(255,71,87,0.3)';
  ctx.shadowBlur = 15;
  ctx.beginPath();
  ctx.moveTo(300, 6);
  ctx.lineTo(285, 28);
  ctx.lineTo(315, 28);
  ctx.closePath();
  ctx.fill();
  ctx.shadowBlur = 0;
}

function spinTo({ targetAngle, duration, spinId, donorName, donorAmount }) {
  if (isSpinning) return;
  currentSpinId = spinId;
  isSpinning = true;
  show();

  // Показываем плашку донатера, если спин по донату
  showDonorBadge(donorName, donorAmount);

  spinSound.loop = true;
  spinSound.volume = 0.2;
  spinSound.currentTime = 0;
  spinSound.play().catch(() => {});

  const startRot = rotation;
  const startTs = performance.now();

  function step(now) {
    const t = Math.min((now - startTs) / duration, 1);
    const eased = 1 - Math.pow(1 - t, 5);
    rotation = startRot + (targetAngle - startRot) * eased;
    draw();
    if (t < 1) requestAnimationFrame(step);
    else {
      rotation = targetAngle % (Math.PI * 2);
      draw();
      isSpinning = false;
      spinSound.pause();
      spinSound.currentTime = 0;
      // Плашку прячем через 3 секунды — чтобы стример и зритель успели
      // прочитать, кому крутилось
      setTimeout(hideDonorBadge, 3000);
    }
  }
  requestAnimationFrame(step);
}

function connect() {
  const ws = new WebSocket(`ws://${location.host}`);
  ws.onmessage = e => {
    const { type, payload } = JSON.parse(e.data);

    if (type === 'state') {
      sectors = payload.wheel.sectors;
      rotation = payload.wheel.currentRotation || 0;
      if (sectors.length > 0) { show(); draw(); }
    }
    if (type === 'wheel:state') {
      sectors = payload.sectors;
      rotation = payload.currentRotation || 0;
      if (sectors.length > 0) { show(); draw(); }
    }
    if (type === 'wheel:spin') {
      sectors = payload.sectors;
      spinTo(payload);
    }
    if (type === 'wheel:completed') {
      // Ничего не делаем — плашка спрячется сама через 3 секунды
      setTimeout(() => { if (!isSpinning) hide(); }, 5000);
    }
  };
  ws.onclose = () => setTimeout(connect, 1000);
}
connect();
</script>
</body>
</html>
