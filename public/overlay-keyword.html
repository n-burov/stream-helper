<!DOCTYPE html>
<html lang="ru">
<head>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
<meta charset="UTF-8" />
<title>Оверлей | Ключевое слово</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    background: transparent !important;
    overflow: hidden;
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: #fff;
  }

  /* Контейнер — размер задаётся здесь. */
  .gif-wrap {
    position: relative;
    width: 700px;      /* ← подгони под нужный размер в OBS */
    display: block;
    user-select: none;
  }

  /* GIF / видео-фон. Растягивается по ширине, высота — по пропорциям. */
  .gif-bg {
    display: block;
    width: 100%;
    height: auto;
    pointer-events: none;
  }

  /* ==== КОДОВОЕ СЛОВО ==== */
  /* Координаты: left/top в процентах от размера фона.
     Подбери через ?debug=1 (см. JS в конце файла). */
  .overlay-word {
    position: absolute;
    left: 66.6%;
    top: 49.3%;
    transform: translate(-50%, -50%);
    font-size: 23px;           /* было 46px, уменьшено в 2 раза */

	font-weight: 600; /* у Bebas Neue только одно начертание, жирность не нужна */
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #ffe066;
    white-space: nowrap;
    text-shadow:
      0 0 10px rgba(0, 0, 0, 1),
      0 0 20px rgba(255, 200, 0, 0.7),
      0 0 40px rgba(255, 150, 0, 0.4);
    transition: transform 0.25s, color 0.25s;
    pointer-events: none;
  }

  /* Лёгкая пульсация, когда идёт сбор */
  .overlay-word.active {
    animation: wordPulse 1.4s ease-in-out infinite;
  }

  @keyframes wordPulse {
    0%, 100% { transform: translate(-50%, -50%) scale(1); }
    50%      { transform: translate(-50%, -50%) scale(1.06); }
  }

  /* ==== DEBUG-РЕЖИМ ==== */
  body.debug .gif-wrap { outline: 2px dashed rgba(255, 0, 255, 0.6); }
  body.debug .overlay-word {
    outline: 1px dashed rgba(0, 255, 255, 0.6);
    background: rgba(0, 255, 255, 0.05);
  }
  .debug-cursor {
    position: fixed;
    top: 12px;
    left: 12px;
    padding: 6px 12px;
    background: rgba(0, 0, 0, 0.85);
    color: #0ff;
    font-family: monospace;
    font-size: 14px;
    border-radius: 6px;
    z-index: 9999;
    pointer-events: none;
  }
</style>
</head>
<body>

<div class="gif-wrap" id="wrap">
  <!--
    Вариант 1: GIF
    <img class="gif-bg" id="gifBg" src="/assets/keyword-bg.gif" alt="" />
  -->

  <!-- Вариант 2: WebM с альфа-каналом (рекомендую — фон будет прозрачным) -->
  <video class="gif-bg" id="gifBg" autoplay loop muted playsinline>
    <source src="/assets/keyword-bg.webm" type="video/webm">
  </video>

  <div class="overlay-word" id="word">!лут</div>
</div>

<script>
// ============================================================
//  DEBUG-РЕЖИМ: открывай с ?debug=1
//  Кликай по нужным местам на фоне — координаты (в %) в консоли.
// ============================================================
(function initDebug() {
  const isDebug = new URLSearchParams(location.search).get('debug') === '1';
  if (!isDebug) return;

  document.body.classList.add('debug');

  const cursorInfo = document.createElement('div');
  cursorInfo.className = 'debug-cursor';
  cursorInfo.textContent = 'Click on background to log coordinates';
  document.body.appendChild(cursorInfo);

  const wrap = document.getElementById('wrap');

  wrap.addEventListener('click', (e) => {
    const r = wrap.getBoundingClientRect();
    const xPx = e.clientX - r.left;
    const yPx = e.clientY - r.top;
    const xPct = (xPx / r.width) * 100;
    const yPct = (yPx / r.height) * 100;
    const text = `left: ${xPct.toFixed(2)}%, top: ${yPct.toFixed(2)}%  (px: ${xPx.toFixed(0)}, ${yPx.toFixed(0)})`;
    cursorInfo.textContent = text;
    console.log('[coords]', text);
  });

  wrap.addEventListener('mousemove', (e) => {
    const r = wrap.getBoundingClientRect();
    const xPct = ((e.clientX - r.left) / r.width) * 100;
    const yPct = ((e.clientY - r.top) / r.height) * 100;
    cursorInfo.textContent = `x: ${xPct.toFixed(2)}%  y: ${yPct.toFixed(2)}%  (click to log)`;
  });
})();

// ============================================================
//  ОСНОВНАЯ ЛОГИКА
// ============================================================
const wordEl = document.getElementById('word');
let ws;

function render(k) {
  if (!k) return;

  wordEl.textContent = k.word || '!лут';

  if (k.status === 'collecting') {
    wordEl.classList.add('active');
  } else {
    wordEl.classList.remove('active');
  }
}

function connect() {
  ws = new WebSocket(`ws://${location.host}`);

  ws.onopen = () => console.log('[overlay-keyword] WS подключён');

  ws.onmessage = (e) => {
    const { type, payload } = JSON.parse(e.data);

    if (type === 'state') render(payload.keyword);
    if (type === 'keyword:state') render(payload);
    // keyword:participant больше не нужен — счётчика нет
  };

  ws.onclose = () => {
    console.log('[overlay-keyword] WS отключён, реконнект через 1с');
    setTimeout(connect, 1000);
  };
}

connect();
</script>
</body>
</html>
