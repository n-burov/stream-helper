<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Оверлей | Ключевое слово</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: transparent !important;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            color: #fff;
        }

        .keyword-wrapper {
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 14px 22px;
            min-width: 200px;
            max-width: 520px;
            width: 100%;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            gap: 16px;
            transition: all 0.3s;
        }

        .keyword-left {
            flex: 1;
            min-width: 0;
        }

        .keyword-title {
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 3px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #f9ca24, #f0932b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.2;
        }

        .keyword-call {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.5);
            font-weight: 400;
            line-height: 1.3;
        }

        .keyword-call strong {
            color: #fff;
            font-weight: 700;
            background: rgba(145, 70, 255, 0.2);
            padding: 1px 10px;
            border-radius: 6px;
            border: 1px solid rgba(145, 70, 255, 0.12);
            font-size: 15px;
        }

        .keyword-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 2px;
            flex-shrink: 0;
        }

        .status-badge {
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            line-height: 1.3;
        }

        .status-badge .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            display: inline-block;
            flex-shrink: 0;
        }

        .status-badge.active .dot {
            background: #00ff64;
            animation: pulse-dot 1.5s infinite;
        }

        .status-badge.inactive .dot {
            background: #ff4757;
        }

        .status-badge.active {
            color: #00ff64;
        }

        .status-badge.inactive {
            color: #ff4757;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.7); }
        }

        .count-badge {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.5);
            display: flex;
            align-items: center;
            gap: 4px;
            line-height: 1.3;
        }

        .count-badge strong {
            color: #fff;
            font-size: 18px;
            font-weight: 700;
        }

        @media (max-width: 600px) {
            .keyword-wrapper {
                padding: 10px 14px;
                gap: 10px;
                border-radius: 12px;
                flex-wrap: wrap;
            }
            .keyword-title { font-size: 20px; letter-spacing: 1px; }
            .keyword-call { font-size: 11px; }
            .keyword-call strong { font-size: 12px; padding: 1px 8px; }
            .keyword-right {
                flex-direction: row;
                align-items: center;
                gap: 12px;
                width: 100%;
                justify-content: flex-start;
                padding-top: 4px;
                border-top: 1px solid rgba(255, 255, 255, 0.04);
            }
            .status-badge { font-size: 11px; }
            .count-badge { font-size: 11px; }
            .count-badge strong { font-size: 15px; }
        }

        @media (max-width: 400px) {
            .keyword-wrapper { padding: 8px 10px; gap: 6px; border-radius: 10px; }
            .keyword-title { font-size: 16px; letter-spacing: 0; }
            .keyword-call { font-size: 10px; }
            .keyword-call strong { font-size: 10px; padding: 0 6px; }
            .keyword-right { gap: 8px; }
            .status-badge { font-size: 9px; }
            .count-badge { font-size: 9px; }
            .count-badge strong { font-size: 12px; }
        }
    </style>
</head>
<body>

    <div class="keyword-wrapper">
        <div class="keyword-left">
            <div class="keyword-title">РОЗЫГРЫШ</div>
            <div class="keyword-call">
                Отправь в чат <strong id="displayKeyword">!лут</strong>
            </div>
        </div>
        <div class="keyword-right">
            <span class="status-badge inactive" id="statusBadge">
                <span class="dot"></span> Остановлен
            </span>
            <span class="count-badge">
                👥 <strong id="participantCount">0</strong>
            </span>
        </div>
    </div>

    <script>
        const MECHANIC = 'keyword';
        const API_URL = `/api/webhook?mechanic=${MECHANIC}`;

        const displayKeyword = document.getElementById('displayKeyword');
        const statusBadge = document.getElementById('statusBadge');
        const participantCount = document.getElementById('participantCount');

        function updateStatus(active) {
            if (active) {
                statusBadge.className = 'status-badge active';
                statusBadge.innerHTML = `<span class="dot"></span> Активен`;
            } else {
                statusBadge.className = 'status-badge inactive';
                statusBadge.innerHTML = `<span class="dot"></span> Остановлен`;
            }
        }

        function renderState(data) {
            if (!data || data.status === 'idle') return;

            displayKeyword.textContent = data.keyword || '!лут';
            participantCount.textContent = data.participants?.length || 0;
            updateStatus(data.status === 'active');
        }

        async function pollState() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                renderState(data);
            } catch (error) {
                // тихо
            }
        }

        setTimeout(pollState, 500);
        setInterval(pollState, 1500);

        console.log('🎬 Оверлей "Ключевое слово" загружен');
        console.log(`📡 Опрос состояния ${MECHANIC} каждые 1.5 секунды`);
    </script>
</body>
</html>
