<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Оверлей | Ключевое слово</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: transparent !important;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            color: #fff;
        }

        .keyword-wrapper {
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 14px 22px;
            min-width: 200px;
            max-width: 520px;
            width: 100%;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            gap: 16px;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .keyword-wrapper::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg, 
                transparent 0deg, 
                rgba(145, 70, 255, 0.03) 60deg, 
                transparent 120deg,
                rgba(0, 212, 255, 0.03) 180deg,
                transparent 240deg,
                rgba(145, 70, 255, 0.03) 300deg,
                transparent 360deg
            );
            animation: rotateBg 20s linear infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes rotateBg {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .keyword-wrapper.active::before {
            animation-duration: 10s;
            background: conic-gradient(from 0deg, 
                transparent 0deg, 
                rgba(0, 255, 100, 0.06) 60deg, 
                transparent 120deg,
                rgba(0, 212, 255, 0.06) 180deg,
                transparent 240deg,
                rgba(0, 255, 100, 0.06) 300deg,
                transparent 360deg
            );
        }

        .keyword-wrapper .glow {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 300px;
            height: 300px;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: radial-gradient(circle, rgba(145, 70, 255, 0.04), transparent 70%);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s;
            z-index: 0;
        }

        .keyword-wrapper.active .glow {
            opacity: 1;
            background: radial-gradient(circle, rgba(0, 255, 100, 0.08), transparent 70%);
        }

        .keyword-left {
            flex: 1;
            min-width: 0;
            position: relative;
            z-index: 1;
        }

        .keyword-title {
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 3px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #f9ca24, #f0932b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.2;
            transition: all 0.5s;
            display: inline-block;
        }

        .keyword-wrapper.active .keyword-title {
            animation: titlePulse 1.5s ease-in-out infinite;
        }

        @keyframes titlePulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        .keyword-call {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.5);
            font-weight: 400;
            line-height: 1.3;
            margin-top: 2px;
        }

        .keyword-call strong {
            color: #fff;
            font-weight: 700;
            background: rgba(145, 70, 255, 0.2);
            padding: 1px 10px;
            border-radius: 6px;
            border: 1px solid rgba(145, 70, 255, 0.12);
            font-size: 15px;
            transition: all 0.3s;
        }

        .keyword-wrapper.active .keyword-call strong {
            background: rgba(0, 255, 100, 0.15);
            border-color: rgba(0, 255, 100, 0.2);
            box-shadow: 0 0 20px rgba(0, 255, 100, 0.05);
        }

        .keyword-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 2px;
            flex-shrink: 0;
            position: relative;
            z-index: 1;
        }

        .status-badge {
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            line-height: 1.3;
            transition: all 0.3s;
        }

        .status-badge .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            display: inline-block;
            flex-shrink: 0;
            transition: all 0.3s;
        }

        .status-badge.active .dot {
            background: #00ff64;
            animation: pulse-dot 1.5s infinite;
        }

        .status-badge.inactive .dot {
            background: #ff4757;
        }

        .status-badge.active {
            color: #00ff64;
        }

        .status-badge.inactive {
            color: #ff4757;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.7); }
        }

        .count-badge {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.5);
            display: flex;
            align-items: center;
            gap: 4px;
            line-height: 1.3;
            transition: all 0.3s;
        }

        .count-badge strong {
            color: #fff;
            font-size: 18px;
            font-weight: 700;
            transition: all 0.3s;
            display: inline-block;
        }

        .count-badge strong.bump {
            animation: countBump 0.3s ease;
        }

        @keyframes countBump {
            0% { transform: scale(1); }
            50% { transform: scale(1.4); color: #00ff64; }
            100% { transform: scale(1); }
        }

        .confetti-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }

        .confetti-piece {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 1px;
            opacity: 0;
        }

        .keyword-wrapper.winner .confetti-piece {
            animation: confettiFall var(--duration, 2s) ease-out forwards;
            animation-delay: var(--delay, 0s);
        }

        @keyframes confettiFall {
            0% {
                opacity: 1;
                transform: translateY(0) rotate(0deg) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(150px) rotate(720deg) scale(0.3);
            }
        }

        @media (max-width: 600px) {
            .keyword-wrapper {
                padding: 10px 14px;
                gap: 10px;
                border-radius: 12px;
                flex-wrap: wrap;
            }
            .keyword-title { font-size: 20px; letter-spacing: 1px; }
            .keyword-call { font-size: 11px; }
            .keyword-call strong { font-size: 12px; padding: 1px 8px; }
            .keyword-right {
                flex-direction: row;
                align-items: center;
                gap: 12px;
                width: 100%;
                justify-content: flex-start;
                padding-top: 4px;
                border-top: 1px solid rgba(255, 255, 255, 0.04);
            }
            .status-badge { font-size: 11px; }
            .count-badge { font-size: 11px; }
            .count-badge strong { font-size: 15px; }
            @keyframes confettiFall {
                0% { opacity: 1; transform: translateY(0) rotate(0deg) scale(1); }
                100% { opacity: 0; transform: translateY(100px) rotate(360deg) scale(0.3); }
            }
        }

        @media (max-width: 400px) {
            .keyword-wrapper { padding: 8px 10px; gap: 6px; border-radius: 10px; }
            .keyword-title { font-size: 16px; letter-spacing: 0; }
            .keyword-call { font-size: 10px; }
            .keyword-call strong { font-size: 10px; padding: 0 6px; }
            .keyword-right { gap: 8px; }
            .status-badge { font-size: 9px; }
            .count-badge { font-size: 9px; }
            .count-badge strong { font-size: 12px; }
        }
    </style>
</head>
<body>

    <div class="keyword-wrapper" id="keywordWrapper">
        <div class="glow"></div>
        <div class="confetti-container" id="confettiContainer"></div>
        
        <div class="keyword-left">
            <div class="keyword-title">РОЗЫГРЫШ</div>
            <div class="keyword-call">
                Отправь в чат <strong id="displayKeyword">!лут</strong>
            </div>
        </div>
        <div class="keyword-right">
            <span class="status-badge inactive" id="statusBadge">
                <span class="dot"></span> Остановлен
            </span>
            <span class="count-badge">
                👥 <strong id="participantCount">0</strong>
            </span>
        </div>
    </div>

    <script>
        const MECHANIC = 'keyword';
        const API_URL = `/api/webhook?mechanic=${MECHANIC}`;

        const wrapper = document.getElementById('keywordWrapper');
        const displayKeyword = document.getElementById('displayKeyword');
        const statusBadge = document.getElementById('statusBadge');
        const participantCount = document.getElementById('participantCount');
        const confettiContainer = document.getElementById('confettiContainer');

        let prevCount = 0;
        let isWinnerShown = false;
        let winnerTimeout = null;
        let lastState = null;

        function createConfetti() {
            confettiContainer.innerHTML = '';
            const colors = ['#ff6b6b', '#feca57', '#48dbfb', '#ff9ff3', '#f9ca24', '#ff4757', '#00d4ff', '#00ff64'];
            
            for (let i = 0; i < 30; i++) {
                const piece = document.createElement('div');
                piece.className = 'confetti-piece';
                piece.style.cssText = `
                    left: ${10 + Math.random() * 80}%;
                    top: ${-10 + Math.random() * 20}%;
                    width: ${3 + Math.random() * 6}px;
                    height: ${3 + Math.random() * 6}px;
                    background: ${colors[Math.floor(Math.random() * colors.length)]};
                    border-radius: ${Math.random() > 0.5 ? '50%' : '1px'};
                    --duration: ${1.5 + Math.random() * 2}s;
                    --delay: ${Math.random() * 0.5}s;
                `;
                confettiContainer.appendChild(piece);
            }
            
            setTimeout(() => {
                confettiContainer.innerHTML = '';
            }, 3500);
        }

        function updateStatus(active) {
            if (winnerTimeout) {
                clearTimeout(winnerTimeout);
                winnerTimeout = null;
            }

            if (active) {
                wrapper.className = 'keyword-wrapper active';
                statusBadge.className = 'status-badge active';
                statusBadge.innerHTML = `<span class="dot"></span> Активен`;
            } else {
                wrapper.className = 'keyword-wrapper';
                statusBadge.className = 'status-badge inactive';
                statusBadge.innerHTML = `<span class="dot"></span> Остановлен`;
            }
        }

        function showWinner(winnerName) {
            if (isWinnerShown) return;
            isWinnerShown = true;

            wrapper.className = 'keyword-wrapper winner';
            statusBadge.className = 'status-badge active';
            statusBadge.innerHTML = `<span class="dot"></span> 🏆 ${winnerName}`;
            
            // Показываем имя победителя вместо ключевого слова
            displayKeyword.textContent = winnerName;
            
            createConfetti();

            winnerTimeout = setTimeout(() => {
                isWinnerShown = false;
                // Возвращаем ключевое слово
                if (lastState && lastState.keyword) {
                    displayKeyword.textContent = lastState.keyword;
                }
                if (lastState) {
                    const isActive = lastState.status === 'active';
                    updateStatus(isActive);
                } else {
                    updateStatus(false);
                }
                winnerTimeout = null;
            }, 4000);
        }

        function renderState(data) {
            if (!data || data.status === 'idle') {
                // Если нет данных — не меняем состояние
                return;
            }

            // Сохраняем последнее состояние
            lastState = data;

            // Если есть победитель в данных (только для ключевого слова!)
            if (data.winner && data.winner !== '—' && data.winner !== null) {
                showWinner(data.winner);
                return;
            }

            // Если оверлей в режиме победителя, но новых данных нет — ничего не делаем
            if (isWinnerShown) return;

            // Обновляем ключевое слово
            displayKeyword.textContent = data.keyword || '!лут';
            
            // Обновляем счёт
            const count = data.participants?.length || 0;
            if (count !== prevCount && count > prevCount) {
                participantCount.textContent = count;
                participantCount.classList.remove('bump');
                void participantCount.offsetWidth;
                participantCount.classList.add('bump');
                setTimeout(() => {
                    participantCount.classList.remove('bump');
                }, 300);
            } else {
                participantCount.textContent = count;
            }
            prevCount = count;

            // Обновляем статус
            const isActive = data.status === 'active';
            updateStatus(isActive);
        }

        async function pollState() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                renderState(data);
            } catch (error) {
                // тихо
            }
        }

        setTimeout(pollState, 500);
        setInterval(pollState, 1500);

        console.log('🎬 Оверлей "Ключевое слово" загружен');
        console.log(`📡 Опрос состояния ${MECHANIC} каждые 1.5 секунды`);
        console.log('✅ Этот оверлей НЕ реагирует на winner-канал');
    </script>
</body>
</html>
