<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оверлей | Ключевое слово</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: transparent !important;
            min-height: 100vh;
            color: #fff;
            padding: 10px;
            overflow: hidden;
        }

        .overlay-container {
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 12px 16px;
            min-width: 200px;
            max-width: 400px;
        }

        .keyword-display {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 4px;
        }

        .keyword-display strong {
            color: #fff;
            font-weight: 600;
        }

        .status-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .status-badge {
            font-size: 13px;
            font-weight: 600;
        }

        .status-badge.active {
            color: #00ff64;
        }

        .status-badge.inactive {
            color: #ff4757;
        }

        .count-badge {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.5);
        }

        .count-badge strong {
            color: #fff;
            font-size: 18px;
        }

        /* ===== АНОНС ПОБЕДИТЕЛЯ ===== */
        .winner-announce {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(20px);
            border: 2px solid rgba(249, 202, 36, 0.3);
            border-radius: 20px;
            padding: 30px 50px;
            text-align: center;
            animation: winnerPop 0.5s ease;
            z-index: 1000;
        }

        .winner-announce.active {
            display: block;
        }

        @keyframes winnerPop {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
            60% { transform: translate(-50%, -50%) scale(1.05); }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }

        .winner-announce .emoji {
            font-size: 48px;
            display: block;
            margin-bottom: 8px;
        }

        .winner-announce .title {
            font-size: 24px;
            font-weight: 900;
            background: linear-gradient(135deg, #f9ca24, #f0932b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .winner-announce .name {
            font-size: 32px;
            font-weight: 700;
            color: #fff;
            margin-top: 4px;
        }

        @keyframes confettiFall {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
        }

        @media (max-width: 480px) {
            .overlay-container {
                padding: 8px 12px;
                min-width: 150px;
            }
            .keyword-display { font-size: 12px; }
            .status-badge { font-size: 11px; }
            .count-badge { font-size: 11px; }
            .count-badge strong { font-size: 16px; }
            .winner-announce { padding: 20px 30px; }
            .winner-announce .name { font-size: 24px; }
            .winner-announce .title { font-size: 20px; }
            .winner-announce .emoji { font-size: 36px; }
        }
    </style>
</head>
<body>

    <div class="overlay-container">
        <div class="keyword-display">
            Кодовое слово: <strong id="displayKeyword">!лут</strong>
        </div>
        <div class="status-row">
            <span class="status-badge inactive" id="statusBadge">⏹ Остановлен</span>
            <span class="count-badge">👥 <strong id="participantCount">0</strong></span>
        </div>
    </div>

    <!-- АНОНС ПОБЕДИТЕЛЯ -->
    <div class="winner-announce" id="winnerAnnounce">
        <span class="emoji">🏆</span>
        <div class="title">ПОБЕДИТЕЛЬ!</div>
        <div class="name" id="winnerName">Игрок</div>
    </div>

    <script>
        const API_URL = '/api/webhook';
        const displayKeyword = document.getElementById('displayKeyword');
        const statusBadge = document.getElementById('statusBadge');
        const participantCount = document.getElementById('participantCount');
        const winnerAnnounce = document.getElementById('winnerAnnounce');
        const winnerName = document.getElementById('winnerName');

        let isWinnerShowing = false;

        function createConfetti() {
            const colors = ['#ff6b6b', '#feca57', '#48dbfb', '#ff9ff3', '#54a0ff', '#f9ca24', '#ff4757', '#00d4ff'];
            for (let i = 0; i < 40; i++) {
                const confetti = document.createElement('div');
                confetti.style.cssText = `
                    position: fixed;
                    width: ${5 + Math.random() * 8}px;
                    height: ${5 + Math.random() * 8}px;
                    background: ${colors[Math.floor(Math.random() * colors.length)]};
                    left: ${Math.random() * 100}vw;
                    top: -20px;
                    border-radius: ${Math.random() > 0.5 ? '50%' : '2px'};
                    animation: confettiFall ${2 + Math.random() * 3}s linear forwards;
                    animation-delay: ${Math.random() * 0.5}s;
                    z-index: 1001;
                    pointer-events: none;
                    transform: rotate(${Math.random() * 360}deg);
                `;
                document.body.appendChild(confetti);
                setTimeout(() => confetti.remove(), 5000);
            }
        }

        function executeCommand(command) {
            const { action, data } = command;

            switch (action) {
                case 'syncState':
                    if (data.keyword) {
                        displayKeyword.textContent = data.keyword.currentKeyword || '!лут';
                        participantCount.textContent = data.keyword.participants?.length || 0;
                        if (data.keyword.active) {
                            statusBadge.textContent = '🟢 Активен';
                            statusBadge.className = 'status-badge active';
                        } else {
                            statusBadge.textContent = '⏹ Остановлен';
                            statusBadge.className = 'status-badge inactive';
                        }
                    }
                    break;

                case 'startKeyword':
                    displayKeyword.textContent = data.keyword || '!лут';
                    statusBadge.textContent = '🟢 Активен';
                    statusBadge.className = 'status-badge active';
                    participantCount.textContent = '0';
                    break;

                case 'stopKeyword':
                    statusBadge.textContent = '⏹ Остановлен';
                    statusBadge.className = 'status-badge inactive';
                    break;

                case 'addParticipant':
                    const currentCount = parseInt(participantCount.textContent) || 0;
                    participantCount.textContent = currentCount + 1;
                    break;

                case 'drawKeyword':
                    winnerName.textContent = data.winner;
                    winnerAnnounce.classList.add('active');
                    createConfetti();
                    isWinnerShowing = true;
                    setTimeout(() => {
                        winnerAnnounce.classList.remove('active');
                        isWinnerShowing = false;
                    }, 5000);
                    break;

                case 'resetKeyword':
                    participantCount.textContent = '0';
                    statusBadge.textContent = '⏹ Остановлен';
                    statusBadge.className = 'status-badge inactive';
                    break;

                case 'showWinner':
                    winnerName.textContent = data.name;
                    winnerAnnounce.classList.add('active');
                    createConfetti();
                    isWinnerShowing = true;
                    setTimeout(() => {
                        winnerAnnounce.classList.remove('active');
                        isWinnerShowing = false;
                    }, 5000);
                    break;
            }
        }

        // Опрос команд
        async function pollCommands() {
            try {
                const response = await fetch(API_URL);
                const command = await response.json();

                if (command.action) {
                    console.log('📥 Получена команда:', command.action);
                    executeCommand(command);
                }
            } catch (error) {
                console.error('❌ Ошибка опроса:', error);
            }
        }

        // Запускаем опрос
        setTimeout(pollCommands, 500);
        setInterval(pollCommands, 1500);

        console.log('🎬 Оверлей "Ключевое слово" загружен');
        console.log('📡 Опрос команд каждые 1.5 секунды');
    </script>
</body>
</html>
