<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Оверлей | Банк 98</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: transparent !important;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
        }

        .bank-wrapper {
            display: none;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(8px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 12px;
            max-width: 100%;
            width: fit-content;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .bank-wrapper.active {
            display: block;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(14, 1fr);
            gap: 3px;
            max-width: 100%;
            min-width: 280px;
        }

        .grid-cell {
            aspect-ratio: 1 / 1;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
            position: relative;
            padding: 2px;
            overflow: hidden;
            min-height: 28px;
            min-width: 28px;
        }

        .grid-cell .cell-number {
            font-size: 6px;
            color: rgba(255, 255, 255, 0.1);
            position: absolute;
            bottom: 1px;
            right: 3px;
            font-weight: 400;
            line-height: 1;
            user-select: none;
        }

        .grid-cell .item-icon {
            font-size: 16px;
            line-height: 1.2;
        }

        .grid-cell .item-name {
            font-size: 5px;
            color: rgba(255, 255, 255, 0.15);
            text-align: center;
            max-width: 90%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            line-height: 1.2;
        }

        .grid-cell.eliminated {
            background: rgba(255, 0, 0, 0.03);
            border-color: rgba(255, 0, 0, 0.02);
            transform: scale(0.4);
            opacity: 0.03;
            transition: all 0.3s ease;
        }

        .grid-cell.eliminated .item-icon,
        .grid-cell.eliminated .item-name,
        .grid-cell.eliminated .cell-number {
            opacity: 0.1;
        }

        .grid-cell.winner {
            background: rgba(249, 202, 36, 0.18);
            border-color: #f9ca24;
            transform: scale(1.1);
            box-shadow: 0 0 24px rgba(249, 202, 36, 0.15);
            animation: winnerPulse 0.8s ease-in-out infinite alternate;
            z-index: 2;
        }

        .grid-cell.winner .item-icon {
            animation: bounce 0.8s ease-in-out infinite alternate;
        }

        @keyframes winnerPulse {
            0% { box-shadow: 0 0 8px rgba(249, 202, 36, 0.08); transform: scale(1.04); }
            100% { box-shadow: 0 0 22px rgba(249, 202, 36, 0.2); transform: scale(1.12); }
        }

        @keyframes bounce {
            0% { transform: translateY(0); }
            100% { transform: translateY(-3px); }
        }

        @media (max-width: 768px) {
            .bank-wrapper { padding: 8px; border-radius: 14px; }
            .grid-container { gap: 2px; min-width: 200px; }
            .grid-cell { min-height: 22px; min-width: 22px; border-radius: 3px; }
            .grid-cell .item-icon { font-size: 12px; }
            .grid-cell .item-name { display: none; }
            .grid-cell .cell-number { font-size: 5px; }
        }

        @media (max-width: 480px) {
            .bank-wrapper { padding: 6px; border-radius: 10px; }
            .grid-container { gap: 1.5px; min-width: 140px; }
            .grid-cell { min-height: 16px; min-width: 16px; border-radius: 2px; padding: 1px; }
            .grid-cell .item-icon { font-size: 9px; }
            .grid-cell .cell-number { font-size: 4px; bottom: 1px; right: 1px; }
        }
    </style>
</head>
<body>

    <div class="bank-wrapper" id="bankWrapper">
        <div class="grid-container" id="bankGrid">
            <!-- Генерируется JS -->
        </div>
    </div>

    <script>
        const MECHANIC = 'bank';
        const API_URL = `/api/webhook?mechanic=${MECHANIC}`;

        const bankWrapper = document.getElementById('bankWrapper');
        const bankGrid = document.getElementById('bankGrid');

        let items = [];
        let eliminated = [];
        let winnerIndex = -1;
        let revealed = false;
        let isRunning = false;
        let hideTimeout = null;
        let intervalId = null;
        let lastWinner = null;

        const itemIcons = [
            '⚔️', '🛡️', '💎', '👑', '🏹', '🗡️', '🔮', '🧙',
            '🐉', '🔥', '❄️', '⚡', '🌿', '💀', '🦴', '🍀',
            '🌟', '🌈', '🎯', '🏆', '💍', '🧪', '📜', '🪄'
        ];

        const itemNames = [
            'Меч', 'Щит', 'Алмаз', 'Корона', 'Лук', 'Кинжал',
            'Кристалл', 'Посох', 'Дракон', 'Огонь', 'Лед', 'Молния',
            'Зелье', 'Череп', 'Кость', 'Клевер', 'Звезда', 'Радуга',
            'Мишень', 'Трофей', 'Кольцо', 'Эликсир', 'Свиток', 'Жезл'
        ];

        function generateBankItems() {
            const arr = [];
            for (let i = 0; i < 98; i++) {
                const idx = Math.floor(Math.random() * itemIcons.length);
                arr.push({ id: i, icon: itemIcons[idx], name: itemNames[idx] });
            }
            return arr;
        }

        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function renderBankGrid() {
            if (!items || items.length === 0) {
                items = generateBankItems();
                shuffleArray(items);
                eliminated = [];
                winnerIndex = -1;
                revealed = false;
            }

            bankGrid.innerHTML = items.map((item, index) => {
                const isEliminated = eliminated.includes(index);
                const isWinner = revealed && index === winnerIndex;
                let classes = 'grid-cell';
                if (isEliminated) classes += ' eliminated';
                if (isWinner) classes += ' winner';
                return `
                    <div class="${classes}" data-index="${index}">
                        <span class="item-icon">${item.icon}</span>
                        <span class="item-name">${item.name}</span>
                        <span class="cell-number">#${index + 1}</span>
                    </div>
                `;
            }).join('');
        }

        function showBank() {
            bankWrapper.classList.add('active');
            if (hideTimeout) {
                clearTimeout(hideTimeout);
                hideTimeout = null;
            }
        }

        function hideBank() {
            bankWrapper.classList.remove('active');
            if (intervalId) {
                clearInterval(intervalId);
                intervalId = null;
            }
            isRunning = false;
            // Сбрасываем состояние
            eliminated = [];
            revealed = false;
            winnerIndex = -1;
            lastWinner = null;
        }

        function resetBankOverlay() {
            if (intervalId) {
                clearInterval(intervalId);
                intervalId = null;
            }
            isRunning = false;
            hideBank();
            if (hideTimeout) {
                clearTimeout(hideTimeout);
                hideTimeout = null;
            }
        }

        function startBankAnimation(data) {
            // Если уже запущена — сбрасываем
            if (isRunning) {
                if (intervalId) {
                    clearInterval(intervalId);
                    intervalId = null;
                }
                isRunning = false;
            }

            if (!data || !data.items) return;

            // Сохраняем данные
            items = data.items;
            winnerIndex = data.winnerIndex !== undefined ? data.winnerIndex : Math.floor(Math.random() * items.length);
            eliminated = [];
            revealed = false;
            lastWinner = null;

            showBank();
            renderBankGrid();

            // Перемешиваем порядок устранения
            const allIndices = Array.from({ length: items.length }, (_, i) => i);
            const toEliminate = allIndices.filter(i => i !== winnerIndex);
            shuffleArray(toEliminate);

            let currentIndex = 0;
            const totalToEliminate = toEliminate.length;
            isRunning = true;

            intervalId = setInterval(() => {
                if (currentIndex >= totalToEliminate) {
                    clearInterval(intervalId);
                    intervalId = null;
                    revealed = true;
                    renderBankGrid();
                    isRunning = false;

                    // Скрываем через 3 секунды и сбрасываем состояние в idle
                    if (hideTimeout) clearTimeout(hideTimeout);
                    hideTimeout = setTimeout(() => {
                        // Скрываем оверлей
                        hideBank();
                        // Сбрасываем состояние в idle, чтобы не перезапускать анимацию
                        items = [];
                        eliminated = [];
                        winnerIndex = -1;
                        revealed = false;
                        lastWinner = null;
                        renderBankGrid();
                        hideTimeout = null;
                    }, 3000);
                    return;
                }

                const idxToEliminate = toEliminate[currentIndex];
                if (!eliminated.includes(idxToEliminate)) {
                    eliminated.push(idxToEliminate);
                }
                currentIndex++;
                renderBankGrid();

            }, 50 + Math.random() * 30);
        }

        function renderState(data) {
            if (!data) {
                resetBankOverlay();
                return;
            }

            // Если статус idle — сбрасываем всё
            if (data.status === 'idle') {
                resetBankOverlay();
                items = [];
                eliminated = [];
                winnerIndex = -1;
                revealed = false;
                lastWinner = null;
                renderBankGrid();
                return;
            }

            // Если статус running и ещё не запущена анимация — запускаем
            if (data.status === 'running' && !isRunning) {
                startBankAnimation(data);
                return;
            }

            // Если статус completed — скрываем и сбрасываем
            if (data.status === 'completed') {
                // Если банк ещё виден — скрываем
                if (bankWrapper.classList.contains('active')) {
                    if (hideTimeout) clearTimeout(hideTimeout);
                    hideTimeout = setTimeout(() => {
                        hideBank();
                        // Сбрасываем состояние в idle
                        items = [];
                        eliminated = [];
                        winnerIndex = -1;
                        revealed = false;
                        lastWinner = null;
                        renderBankGrid();
                        hideTimeout = null;
                    }, 3000);
                } else {
                    // Если банк уже скрыт — просто сбрасываем состояние
                    items = [];
                    eliminated = [];
                    winnerIndex = -1;
                    revealed = false;
                    lastWinner = null;
                    renderBankGrid();
                }
                // Сбрасываем флаг isRunning, если он ещё активен
                if (isRunning) {
                    isRunning = false;
                    if (intervalId) {
                        clearInterval(intervalId);
                        intervalId = null;
                    }
                }
                return;
            }
        }

        async function pollState() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                renderState(data);
            } catch (error) {
                // тихо
            }
        }

        setTimeout(pollState, 500);
        setInterval(pollState, 1500);

        renderBankGrid();

        console.log('🎬 Оверлей "Банк 98" загружен');
        console.log(`📡 Опрос состояния ${MECHANIC} каждые 1.5 секунды`);
    </script>
</body>
</html>
