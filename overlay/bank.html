<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Оверлей | Банк 98</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: transparent !important;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
        }

        .bank-wrapper {
            display: none;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(8px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 12px;
            max-width: 100%;
            width: fit-content;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .bank-wrapper.active {
            display: block;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(14, 1fr);
            gap: 3px;
            max-width: 100%;
            min-width: 280px;
        }

        .grid-cell {
            aspect-ratio: 1 / 1;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
            padding: 4px;
            overflow: hidden;
            min-height: 28px;
            min-width: 28px;
        }

        .grid-cell .item-icon {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            image-rendering: pixelated;
            border-radius: 4px;
        }

        .grid-cell .item-name {
            display: none !important;
        }

        .grid-cell.eliminated {
            background: rgba(255, 0, 0, 0.03);
            border-color: rgba(255, 0, 0, 0.02);
            transform: scale(0.4);
            opacity: 0.03;
            transition: all 0.3s ease;
        }

        .grid-cell.eliminated .item-icon {
            opacity: 0.1;
        }

        .grid-cell.winner {
            background: rgba(249, 202, 36, 0.18);
            border-color: #f9ca24;
            transform: scale(1.1);
            box-shadow: 0 0 24px rgba(249, 202, 36, 0.15);
            animation: winnerPulse 0.8s ease-in-out infinite alternate;
            z-index: 2;
        }

        .grid-cell.winner .item-icon {
            animation: bounce 0.8s ease-in-out infinite alternate;
        }

        @keyframes winnerPulse {
            0% { box-shadow: 0 0 8px rgba(249, 202, 36, 0.08); transform: scale(1.04); }
            100% { box-shadow: 0 0 22px rgba(249, 202, 36, 0.2); transform: scale(1.12); }
        }

        @keyframes bounce {
            0% { transform: translateY(0); }
            100% { transform: translateY(-3px); }
        }

        @media (max-width: 768px) {
            .bank-wrapper { padding: 8px; border-radius: 14px; }
            .grid-container { gap: 2px; min-width: 200px; }
            .grid-cell { min-height: 22px; min-width: 22px; border-radius: 3px; padding: 3px; }
        }

        @media (max-width: 480px) {
            .bank-wrapper { padding: 6px; border-radius: 10px; }
            .grid-container { gap: 1.5px; min-width: 140px; }
            .grid-cell { min-height: 16px; min-width: 16px; border-radius: 2px; padding: 2px; }
        }
    </style>
</head>
<body>

    <div class="bank-wrapper" id="bankWrapper">
        <div class="grid-container" id="bankGrid">
            <!-- Генерируется JS -->
        </div>
    </div>

    <script>
        const MECHANIC = 'bank';
        const API_URL = `/api/webhook?mechanic=${MECHANIC}`;
        const WINNER_API_URL = '/api/winner';

        const bankWrapper = document.getElementById('bankWrapper');
        const bankGrid = document.getElementById('bankGrid');

        let currentAnimationId = null;
        let isAnimating = false;
        let hideTimeout = null;
        let lastProcessedTimestamp = 0;
        let isDoneSent = false;

        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function renderGrid(items, itemsData, eliminated, winnerIndex, revealed) {
            if (!items || items.length === 0) {
                bankGrid.innerHTML = '';
                return;
            }

            bankGrid.innerHTML = items.map((item, index) => {
                const isEliminated = eliminated.includes(index);
                const isWinner = revealed && index === winnerIndex;

                const data = itemsData && itemsData[index] ? itemsData[index] : { color: 'ffffff', icon: '' };
                const color = data.color || 'ffffff';
                const iconUrl = data.icon || 'https://cdn3.scourge.tech/icons/inv_misc_questionmark.png';

                let classes = 'grid-cell';
                if (isEliminated) classes += ' eliminated';
                if (isWinner) classes += ' winner';

                const borderStyle = isWinner ?
                    `border-color: #${color}; box-shadow: 0 0 20px rgba(${parseInt(color.slice(0,2), 16)}, ${parseInt(color.slice(2,4), 16)}, ${parseInt(color.slice(4,6), 16)}, 0.3);` :
                    '';

                return `
                    <div class="${classes}" data-index="${index}" style="${borderStyle}">
                        <img class="item-icon" src="${iconUrl}" alt="${data.name || '#'}" loading="lazy" />
                    </div>
                `;
            }).join('');
        }

        function showBank() {
            bankWrapper.classList.add('active');
            if (hideTimeout) {
                clearTimeout(hideTimeout);
                hideTimeout = null;
            }
        }

        function hideBank() {
            bankWrapper.classList.remove('active');
            bankGrid.innerHTML = '';
            if (hideTimeout) {
                clearTimeout(hideTimeout);
                hideTimeout = null;
            }
        }

        async function sendDone() {
            if (isDoneSent) return;
            isDoneSent = true;
            try {
                await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mechanic: 'bank', data: { status: 'done' } }),
                });
                console.log('✅ Отправлено done на сайт');
            } catch (error) {
                console.error('❌ Ошибка отправки done:', error);
            }
        }

        async function sendWinnerToCommonOverlay(name, emoji, title, subtitle, tag, iconUrl, color) {
            try {
                const winnerData = {
                    name: name,
                    emoji: emoji || '🏆',
                    title: title || 'ВЫИГРЫШ',
                    tag: tag || '🏆 Банк 98',
                    icon: iconUrl || null,
                    color: color || null,
                };
                await fetch(WINNER_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(winnerData),
                });
                console.log('🏆 Победитель отправлен в общий оверлей:', name);
            } catch (error) {
                console.error('❌ Ошибка отправки победителя:', error);
            }
        }

        function startBankAnimation(items, itemsData, winnerIndex, timestamp) {
            if (isAnimating && lastProcessedTimestamp === timestamp) {
                console.log('⏳ Анимация уже запущена, игнорируем дубль');
                return;
            }

            if (isAnimating) {
                if (currentAnimationId) {
                    clearInterval(currentAnimationId);
                    currentAnimationId = null;
                }
                isAnimating = false;
                if (hideTimeout) {
                    clearTimeout(hideTimeout);
                    hideTimeout = null;
                }
                isDoneSent = false;
            }

            const winnerData = itemsData && itemsData[winnerIndex] ? itemsData[winnerIndex] : null;
            const winnerName = winnerData ? `${winnerData.name || '#'} #${winnerIndex + 1}` : `#${winnerIndex + 1}`;
            const winnerIcon = winnerData ? winnerData.icon : null;
            const winnerColor = winnerData ? winnerData.color : 'ffffff';

            console.log('🎬 Запуск анимации банка, победитель:', winnerIndex);

            lastProcessedTimestamp = timestamp;
            isAnimating = true;
            isDoneSent = false;
            showBank();

            const eliminated = [];
            let revealed = false;

            renderGrid(items, itemsData, eliminated, winnerIndex, false);

            const allIndices = Array.from({ length: items.length }, (_, i) => i);
            const toEliminate = allIndices.filter(i => i !== winnerIndex);
            shuffleArray(toEliminate);

            let currentIndex = 0;
            const totalToEliminate = toEliminate.length;

            currentAnimationId = setInterval(() => {
                if (currentIndex >= totalToEliminate) {
                    clearInterval(currentAnimationId);
                    currentAnimationId = null;

                    revealed = true;
                    renderGrid(items, itemsData, eliminated, winnerIndex, true);
                    isAnimating = false;

                    sendWinnerToCommonOverlay(
                        winnerName,
                        '🏆',
                        'ВЫИГРЫШ',
                        null,
                        '🏆 Банк 98',
                        winnerIcon,
                        winnerColor
                    );

                    sendDone();

                    if (hideTimeout) clearTimeout(hideTimeout);
                    hideTimeout = setTimeout(() => {
                        hideBank();
                        isAnimating = false;
                        lastProcessedTimestamp = 0;
                        hideTimeout = null;
                    }, 3000);
                    return;
                }

                const idxToEliminate = toEliminate[currentIndex];
                if (!eliminated.includes(idxToEliminate)) {
                    eliminated.push(idxToEliminate);
                }
                currentIndex++;
                renderGrid(items, itemsData, eliminated, winnerIndex, false);

            }, 60 + Math.random() * 40);
        }

        function renderState(data) {
            if (!data) return;

            if (data.status === 'idle' || data.status === 'done') {
                if (isAnimating) {
                    if (currentAnimationId) {
                        clearInterval(currentAnimationId);
                        currentAnimationId = null;
                    }
                    isAnimating = false;
                }
                if (hideTimeout) {
                    clearTimeout(hideTimeout);
                    hideTimeout = null;
                }
                hideBank();
                lastProcessedTimestamp = 0;
                isDoneSent = false;
                return;
            }

            if (data.status === 'running' && data.items && data.winnerIndex !== undefined) {
                const timestamp = data.timestamp || Date.now();
                startBankAnimation(data.items, data.itemsData || [], data.winnerIndex, timestamp);
                return;
            }
        }

        async function pollState() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                renderState(data);
            } catch (error) {
                // тихо
            }
        }

        setTimeout(pollState, 500);
        setInterval(pollState, 1500);

        console.log('🎬 Оверлей "Банк 98" загружен');
        console.log(`📡 Опрос состояния ${MECHANIC} каждые 1.5 секунды`);
    </script>
</body>
</html>
