<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Оверлей | Банк 98</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: transparent !important;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
        }

        .bank-wrapper {
            display: none;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(8px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 12px;
            max-width: 100%;
            width: fit-content;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .bank-wrapper.active {
            display: block;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(14, 1fr);
            gap: 3px;
            max-width: 100%;
            min-width: 280px;
        }

        .grid-cell {
            aspect-ratio: 1 / 1;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
            position: relative;
            padding: 2px;
            overflow: hidden;
            min-height: 28px;
            min-width: 28px;
        }

        .grid-cell .cell-number {
            font-size: 6px;
            color: rgba(255, 255, 255, 0.1);
            position: absolute;
            bottom: 1px;
            right: 3px;
            font-weight: 400;
            line-height: 1;
            user-select: none;
        }

        .grid-cell .item-icon {
            font-size: 16px;
            line-height: 1.2;
        }

        .grid-cell .item-name {
            font-size: 5px;
            color: rgba(255, 255, 255, 0.15);
            text-align: center;
            max-width: 90%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            line-height: 1.2;
        }

        .grid-cell.eliminated {
            background: rgba(255, 0, 0, 0.03);
            border-color: rgba(255, 0, 0, 0.02);
            transform: scale(0.4);
            opacity: 0.03;
            transition: all 0.3s ease;
        }

        .grid-cell.eliminated .item-icon,
        .grid-cell.eliminated .item-name,
        .grid-cell.eliminated .cell-number {
            opacity: 0.1;
        }

        .grid-cell.winner {
            background: rgba(249, 202, 36, 0.18);
            border-color: #f9ca24;
            transform: scale(1.1);
            box-shadow: 0 0 24px rgba(249, 202, 36, 0.15);
            animation: winnerPulse 0.8s ease-in-out infinite alternate;
            z-index: 2;
        }

        .grid-cell.winner .item-icon {
            animation: bounce 0.8s ease-in-out infinite alternate;
        }

        @keyframes winnerPulse {
            0% { box-shadow: 0 0 8px rgba(249, 202, 36, 0.08); transform: scale(1.04); }
            100% { box-shadow: 0 0 22px rgba(249, 202, 36, 0.2); transform: scale(1.12); }
        }

        @keyframes bounce {
            0% { transform: translateY(0); }
            100% { transform: translateY(-3px); }
        }

        @media (max-width: 768px) {
            .bank-wrapper { padding: 8px; border-radius: 14px; }
            .grid-container { gap: 2px; min-width: 200px; }
            .grid-cell { min-height: 22px; min-width: 22px; border-radius: 3px; }
            .grid-cell .item-icon { font-size: 12px; }
            .grid-cell .item-name { display: none; }
            .grid-cell .cell-number { font-size: 5px; }
        }

        @media (max-width: 480px) {
            .bank-wrapper { padding: 6px; border-radius: 10px; }
            .grid-container { gap: 1.5px; min-width: 140px; }
            .grid-cell { min-height: 16px; min-width: 16px; border-radius: 2px; padding: 1px; }
            .grid-cell .item-icon { font-size: 9px; }
            .grid-cell .cell-number { font-size: 4px; bottom: 1px; right: 1px; }
        }
    </style>
</head>
<body>

    <div class="bank-wrapper" id="bankWrapper">
        <div class="grid-container" id="bankGrid">
            <!-- Генерируется JS -->
        </div>
    </div>

    <script>
        const MECHANIC = 'bank';
        const API_URL = `/api/webhook?mechanic=${MECHANIC}`;

        const bankWrapper = document.getElementById('bankWrapper');
        const bankGrid = document.getElementById('bankGrid');

        // ===== СОСТОЯНИЕ =====
        let currentAnimationId = null;
        let isAnimating = false;
        let hideTimeout = null;
        let lastProcessedTimestamp = 0;

        const itemIcons = [
            '⚔️', '🛡️', '💎', '👑', '🏹', '🗡️', '🔮', '🧙',
            '🐉', '🔥', '❄️', '⚡', '🌿', '💀', '🦴', '🍀',
            '🌟', '🌈', '🎯', '🏆', '💍', '🧪', '📜', '🪄'
        ];

        const itemNames = [
            'Меч', 'Щит', 'Алмаз', 'Корона', 'Лук', 'Кинжал',
            'Кристалл', 'Посох', 'Дракон', 'Огонь', 'Лед', 'Молния',
            'Зелье', 'Череп', 'Кость', 'Клевер', 'Звезда', 'Радуга',
            'Мишень', 'Трофей', 'Кольцо', 'Эликсир', 'Свиток', 'Жезл'
        ];

        function generateBankItems() {
            const arr = [];
            for (let i = 0; i < 98; i++) {
                const idx = Math.floor(Math.random() * itemIcons.length);
                arr.push({ id: i, icon: itemIcons[idx], name: itemNames[idx] });
            }
            return arr;
        }

        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function renderGrid(items, eliminated, winnerIndex, revealed) {
            if (!items || items.length === 0) {
                bankGrid.innerHTML = '';
                return;
            }

            bankGrid.innerHTML = items.map((item, index) => {
                const isEliminated = eliminated.includes(index);
                const isWinner = revealed && index === winnerIndex;
                let classes = 'grid-cell';
                if (isEliminated) classes += ' eliminated';
                if (isWinner) classes += ' winner';
                return `
                    <div class="${classes}" data-index="${index}">
                        <span class="item-icon">${item.icon}</span>
                        <span class="item-name">${item.name}</span>
                        <span class="cell-number">#${index + 1}</span>
                    </div>
                `;
            }).join('');
        }

        function showBank() {
            bankWrapper.classList.add('active');
            if (hideTimeout) {
                clearTimeout(hideTimeout);
                hideTimeout = null;
            }
        }

        function hideBank() {
            bankWrapper.classList.remove('active');
            // Очищаем грид
            bankGrid.innerHTML = '';
            if (hideTimeout) {
                clearTimeout(hideTimeout);
                hideTimeout = null;
            }
        }

        // ===== ОСНОВНАЯ АНИМАЦИЯ =====
        function startBankAnimation(items, winnerIndex, timestamp) {
            // Если анимация уже запущена и это та же команда — игнорируем
            if (isAnimating && lastProcessedTimestamp === timestamp) {
                console.log('⏳ Анимация уже запущена, игнорируем дубль');
                return;
            }

            // Если анимация уже запущена — сбрасываем
            if (isAnimating) {
                if (currentAnimationId) {
                    clearInterval(currentAnimationId);
                    currentAnimationId = null;
                }
                isAnimating = false;
                if (hideTimeout) {
                    clearTimeout(hideTimeout);
                    hideTimeout = null;
                }
            }

            console.log('🎬 Запуск анимации банка, победитель:', winnerIndex);

            lastProcessedTimestamp = timestamp;
            isAnimating = true;
            showBank();

            const eliminated = [];
            let revealed = false;

            // Сразу рендерим все ячейки
            renderGrid(items, eliminated, winnerIndex, false);

            // Перемешиваем порядок устранения
            const allIndices = Array.from({ length: items.length }, (_, i) => i);
            const toEliminate = allIndices.filter(i => i !== winnerIndex);
            shuffleArray(toEliminate);

            let currentIndex = 0;
            const totalToEliminate = toEliminate.length;

            currentAnimationId = setInterval(() => {
                if (currentIndex >= totalToEliminate) {
                    clearInterval(currentAnimationId);
                    currentAnimationId = null;

                    // Показываем победителя
                    revealed = true;
                    renderGrid(items, eliminated, winnerIndex, true);
                    isAnimating = false;

                    // Скрываем через 3 секунды
                    if (hideTimeout) clearTimeout(hideTimeout);
                    hideTimeout = setTimeout(() => {
                        hideBank();
                        // Сбрасываем состояние
                        isAnimating = false;
                        lastProcessedTimestamp = 0;
                        hideTimeout = null;
                    }, 3000);
                    return;
                }

                const idxToEliminate = toEliminate[currentIndex];
                if (!eliminated.includes(idxToEliminate)) {
                    eliminated.push(idxToEliminate);
                }
                currentIndex++;
                renderGrid(items, eliminated, winnerIndex, false);

            }, 60 + Math.random() * 40);
        }

        // ===== ОБРАБОТКА СОСТОЯНИЯ =====
        function renderState(data) {
            if (!data) return;

            // Если idle — скрываем оверлей
            if (data.status === 'idle') {
                if (isAnimating) {
                    // Если анимация запущена, не прерываем, но помечаем для сброса
                }
                // Если оверлей виден — скрываем
                if (bankWrapper.classList.contains('active')) {
                    hideBank();
                }
                return;
            }

            // Если running и есть данные — запускаем анимацию
            if (data.status === 'running' && data.items && data.winnerIndex !== undefined) {
                // Проверяем timestamp, чтобы не запускать одну и ту же анимацию дважды
                const timestamp = data.timestamp || Date.now();
                startBankAnimation(data.items, data.winnerIndex, timestamp);
                return;
            }

            // Если completed — скрываем оверлей
            if (data.status === 'completed') {
                if (bankWrapper.classList.contains('active')) {
                    if (hideTimeout) clearTimeout(hideTimeout);
                    hideTimeout = setTimeout(() => {
                        hideBank();
                        isAnimating = false;
                        lastProcessedTimestamp = 0;
                        hideTimeout = null;
                    }, 3000);
                }
                return;
            }
        }

        // ===== ОПРОС =====
        async function pollState() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                renderState(data);
            } catch (error) {
                // тихо
            }
        }

        setTimeout(pollState, 500);
        setInterval(pollState, 1500);

        console.log('🎬 Оверлей "Банк 98" загружен');
        console.log(`📡 Опрос состояния ${MECHANIC} каждые 1.5 секунды`);
    </script>
</body>
</html>
