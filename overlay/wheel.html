<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🎡 Колесо фортуны | Оверлей</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: transparent !important;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
        }

        .wheel-overlay {
            display: none;
            position: relative;
            align-items: center;
            justify-content: center;
            width: 420px;
            height: 420px;
        }

        .wheel-overlay.active {
            display: flex;
        }

        .wheel-bg {
            position: absolute;
            width: 420px;
            height: 420px;
            border-radius: 50%;
            background: radial-gradient(circle at center, rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.7));
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-shadow: 0 0 60px rgba(0, 0, 0, 0.3);
            z-index: 0;
        }

        .wheel-wrapper {
            position: relative;
            z-index: 1;
            width: 350px;
            height: 350px;
        }

        #wheelCanvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 0 40px rgba(145, 70, 255, 0.1);
            transition: box-shadow 0.3s;
        }

        #wheelCanvas.spinning {
            box-shadow: 0 0 60px rgba(145, 70, 255, 0.2);
        }

        .winner-label {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 32px;
            font-weight: 900;
            color: #f9ca24;
            text-shadow: 0 0 40px rgba(249, 202, 36, 0.3);
            z-index: 10;
            pointer-events: none;
            background: rgba(0, 0, 0, 0.6);
            padding: 16px 30px;
            border-radius: 16px;
            border: 2px solid rgba(249, 202, 36, 0.3);
            animation: winnerPop 0.6s ease;
            text-align: center;
        }

        @keyframes winnerPop {
            0% {
                transform: translate(-50%, -50%) scale(0.5);
                opacity: 0;
            }
            60% {
                transform: translate(-50%, -50%) scale(1.1);
            }
            100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }
        }

        @media (max-width: 480px) {
            .wheel-overlay { width: 280px; height: 280px; }
            .wheel-bg { width: 280px; height: 280px; }
            .wheel-wrapper { width: 220px; height: 220px; }
            .winner-label { font-size: 22px; padding: 10px 18px; }
        }
    </style>
</head>
<body>

    <div class="wheel-overlay" id="wheelOverlay">
        <div class="wheel-bg"></div>
        <div class="wheel-wrapper">
            <canvas id="wheelCanvas" width="600" height="600"></canvas>
        </div>
    </div>

    <script>
        const MECHANIC = 'wheel';
        const API_URL = `/api/webhook?mechanic=${MECHANIC}`;

        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        const wheelOverlay = document.getElementById('wheelOverlay');

        let sectors = [];
        let currentRotation = 0;
        let isSpinning = false;
        let hideTimeout = null;
        let animationId = null;
        let isActive = false;
        let lastWinner = null;

        const defaultColors = [
            '#ff6b6b', '#feca57', '#48dbfb', '#ff9ff3',
            '#54a0ff', '#5f27cd', '#1dd1a1', '#f368e0',
            '#00d2d3', '#ff9f43', '#10ac84', '#ee5a24'
        ];

        function showOverlay() {
            if (!isActive) {
                isActive = true;
                wheelOverlay.classList.add('active');
            }
            if (hideTimeout) {
                clearTimeout(hideTimeout);
                hideTimeout = null;
            }
        }

        function hideOverlay() {
            isActive = false;
            wheelOverlay.classList.remove('active');
            if (hideTimeout) {
                clearTimeout(hideTimeout);
                hideTimeout = null;
            }
        }

        function drawWheel() {
            if (!sectors || sectors.length === 0) {
                ctx.clearRect(0, 0, 600, 600);
                ctx.fillStyle = 'rgba(255,255,255,0.03)';
                ctx.beginPath();
                ctx.arc(300, 300, 240, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = 'rgba(255,255,255,0.1)';
                ctx.font = '20px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('Ожидание...', 300, 300);
                return;
            }

            const totalWeight = sectors.reduce((sum, s) => sum + s.weight, 0);
            let startAngle = currentRotation;

            ctx.clearRect(0, 0, 600, 600);

            sectors.forEach((sector, i) => {
                const sliceAngle = (sector.weight / totalWeight) * Math.PI * 2;
                const endAngle = startAngle + sliceAngle;

                ctx.beginPath();
                ctx.moveTo(300, 300);
                ctx.arc(300, 300, 280, startAngle, endAngle);
                ctx.closePath();

                ctx.fillStyle = sector.color || defaultColors[i % defaultColors.length];
                ctx.fill();
                ctx.strokeStyle = 'rgba(255,255,255,0.06)';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                const midAngle = startAngle + sliceAngle / 2;
                const textRadius = 195;
                const x = 300 + Math.cos(midAngle) * textRadius;
                const y = 300 + Math.sin(midAngle) * textRadius;

                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(midAngle + (midAngle > Math.PI / 2 ? Math.PI : 0));
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 14px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.shadowColor = 'rgba(0,0,0,0.5)';
                ctx.shadowBlur = 3;
                const label = sector.label.length > 10 ? sector.label.slice(0, 8) + '…' : sector.label;
                ctx.fillText(label, 0, 0);
                ctx.restore();

                startAngle = endAngle;
            });

            ctx.beginPath();
            ctx.arc(300, 300, 280, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(255,255,255,0.06)';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.fillStyle = '#ff4757';
            ctx.shadowColor = 'rgba(255,71,87,0.3)';
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.moveTo(300, 6);
            ctx.lineTo(285, 28);
            ctx.lineTo(315, 28);
            ctx.closePath();
            ctx.fill();
            ctx.shadowBlur = 0;

            ctx.fillStyle = 'rgba(255,255,255,0.08)';
            ctx.beginPath();
            ctx.arc(300, 33, 4, 0, Math.PI * 2);
            ctx.fill();
        }

        function resetOverlay() {
            if (animationId) {
                cancelAnimationFrame(animationId);
                animationId = null;
            }
            isSpinning = false;
            canvas.classList.remove('spinning');
            if (hideTimeout) {
                clearTimeout(hideTimeout);
                hideTimeout = null;
            }
            // Удаляем старый победный текст
            const oldWinner = document.querySelector('.winner-label');
            if (oldWinner) oldWinner.remove();
        }

        function showWinner(label) {
            const oldWinner = document.querySelector('.winner-label');
            if (oldWinner) oldWinner.remove();
            
            const winnerEl = document.createElement('div');
            winnerEl.className = 'winner-label';
            winnerEl.textContent = `🎉 ${label}`;
            wheelOverlay.appendChild(winnerEl);
            
            setTimeout(() => {
                if (winnerEl.parentNode) winnerEl.remove();
            }, 4000);
        }

        function spinWheelToTarget(targetAngle, duration, callback) {
            if (isSpinning) return;
            if (!sectors || sectors.length === 0) return;

            showOverlay();
            isSpinning = true;
            canvas.classList.add('spinning');

            const startTime = Date.now();
            const startRotation = currentRotation;

            function animate() {
                const elapsed = Date.now() - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const eased = 1 - Math.pow(1 - progress, 5);
                currentRotation = startRotation + (targetAngle - startRotation) * eased;
                drawWheel();

                if (progress < 1) {
                    animationId = requestAnimationFrame(animate);
                } else {
                    currentRotation = targetAngle % (Math.PI * 2);
                    drawWheel();
                    isSpinning = false;
                    canvas.classList.remove('spinning');

                    if (callback) callback();

                    if (hideTimeout) clearTimeout(hideTimeout);
                    hideTimeout = setTimeout(() => {
                        hideOverlay();
                        hideTimeout = null;
                    }, 3000);
                }
            }
            animate();
        }

        function renderState(data) {
            if (!data || !data.sectors || data.sectors.length === 0) {
                if (isActive && !isSpinning) {
                    resetOverlay();
                    hideOverlay();
                }
                return;
            }

            // Обновляем сектора если изменились
            if (data.sectors) {
                const newSectors = JSON.stringify(data.sectors);
                const oldSectors = JSON.stringify(sectors);
                if (newSectors !== oldSectors) {
                    sectors = data.sectors;
                    drawWheel();
                }
            }

            // Если статус spinning и мы не крутим — запускаем
            if (data.status === 'spinning' && !isSpinning) {
                if (data.targetAngle !== undefined) {
                    if (hideTimeout) {
                        clearTimeout(hideTimeout);
                        hideTimeout = null;
                    }

                    const extraSpins = 15 * Math.PI * 2;
                    const targetWithSpins = data.targetAngle + extraSpins;
                    const duration = 15000;

                    spinWheelToTarget(targetWithSpins, duration, () => {
                        if (data.winnerLabel) {
                            showWinner(data.winnerLabel);
                            fetch('/api/winner', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    name: data.winnerLabel,
                                    emoji: '🎉',
                                    title: 'ВЫИГРЫШ',
                                    tag: '🎡 Колесо фортуны',
                                    icon: null,
                                    color: null,
                                }),
                            }).catch(() => {});
                        }
                    });
                }
                return;
            }

            // Если статус completed — показываем победителя если его ещё нет
            if (data.status === 'completed' && data.winner) {
                if (lastWinner !== data.winner) {
                    lastWinner = data.winner;
                    showWinner(data.winner);
                }
                if (isSpinning) {
                    isSpinning = false;
                    canvas.classList.remove('spinning');
                    if (animationId) {
                        cancelAnimationFrame(animationId);
                        animationId = null;
                    }
                }
                return;
            }

            // Если статус idle — скрываем
            if (data.status === 'idle' || data.status === 'completed') {
                if (isActive && !isSpinning) {
                    resetOverlay();
                    hideOverlay();
                }
                return;
            }
        }

        async function pollState() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                renderState(data);
            } catch (error) {
                // тихо
            }
        }

        setTimeout(pollState, 500);
        setInterval(pollState, 1500);

        drawWheel();

        console.log('🎬 Оверлей "Колесо фортуны" загружен');
        console.log('📡 Опрос состояния каждые 1.5 секунды');
        console.log('👁️ Оверлей появляется только при активном вращении');
    </script>
</body>
</html>
