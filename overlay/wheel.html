<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Оверлей | Колесо фортуны</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: transparent !important;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
        }

        .wheel-overlay {
            display: none;
            position: relative;
            align-items: center;
            justify-content: center;
            width: 420px;
            height: 420px;
        }

        .wheel-overlay.active {
            display: flex;
        }

        .wheel-wrapper {
            position: relative;
            z-index: 1;
            width: 350px;
            height: 350px;
        }

        #wheelCanvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 
                0 0 60px rgba(145, 70, 255, 0.15),
                0 0 120px rgba(145, 70, 255, 0.08),
                0 0 200px rgba(145, 70, 255, 0.04);
            transition: box-shadow 0.3s;
        }

        #wheelCanvas.spinning {
            box-shadow: 
                0 0 80px rgba(145, 70, 255, 0.25),
                0 0 160px rgba(145, 70, 255, 0.12),
                0 0 240px rgba(145, 70, 255, 0.06);
        }

        @media (max-width: 480px) {
            .wheel-overlay { width: 280px; height: 280px; }
            .wheel-wrapper { width: 220px; height: 220px; }
            #wheelCanvas { box-shadow: 0 0 30px rgba(145, 70, 255, 0.12); }
            #wheelCanvas.spinning { box-shadow: 0 0 50px rgba(145, 70, 255, 0.2); }
        }
    </style>
</head>
<body>

    <div class="wheel-overlay" id="wheelOverlay">
        <div class="wheel-wrapper">
            <canvas id="wheelCanvas" width="600" height="600"></canvas>
        </div>
    </div>

    <script>
        const MECHANIC = 'wheel';
        const API_URL = `/api/webhook?mechanic=${MECHANIC}`;

        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        const wheelOverlay = document.getElementById('wheelOverlay');

        let sectors = [];
        let currentRotation = 0;
        let isSpinning = false;
        let hideTimeout = null;
        let animationId = null;
        let isActive = false;
        let spinStartTime = 0;
        let spinDuration = 15000;
        let spinTargetAngle = 0;
        let spinStartRotation = 0;
        let currentSpinId = null;
        let hideScheduled = false;
        let fixedTargetAngle = null;
        let processedSpinIds = new Set();

        const defaultColors = [
            '#ff6b6b', '#feca57', '#48dbfb', '#ff9ff3',
            '#54a0ff', '#5f27cd', '#1dd1a1', '#f368e0',
            '#00d2d3', '#ff9f43', '#10ac84', '#ee5a24'
        ];

        function showOverlay() {
            if (!isActive) {
                isActive = true;
                wheelOverlay.classList.add('active');
            }
            if (hideTimeout) {
                clearTimeout(hideTimeout);
                hideTimeout = null;
            }
        }

        function hideOverlay() {
            isActive = false;
            hideScheduled = false;
            currentSpinId = null;
            fixedTargetAngle = null;
            wheelOverlay.classList.remove('active');
            if (hideTimeout) {
                clearTimeout(hideTimeout);
                hideTimeout = null;
            }
        }

        function scheduleHide(delay) {
            if (hideScheduled) return;
            hideScheduled = true;
            if (hideTimeout) {
                clearTimeout(hideTimeout);
                hideTimeout = null;
            }
            hideTimeout = setTimeout(() => {
                if (!isSpinning) {
                    hideOverlay();
                }
                hideTimeout = null;
                hideScheduled = false;
            }, delay || 3000);
        }

        function drawWheel() {
            if (!sectors || sectors.length === 0) {
                ctx.clearRect(0, 0, 600, 600);
                ctx.fillStyle = 'rgba(255,255,255,0.03)';
                ctx.beginPath();
                ctx.arc(300, 300, 240, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = 'rgba(255,255,255,0.1)';
                ctx.font = '20px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('Ожидание...', 300, 300);
                return;
            }

            const totalWeight = sectors.reduce((sum, s) => sum + s.weight, 0);
            let startAngle = currentRotation;

            ctx.clearRect(0, 0, 600, 600);

            sectors.forEach((sector, i) => {
                const sliceAngle = (sector.weight / totalWeight) * Math.PI * 2;
                const endAngle = startAngle + sliceAngle;

                ctx.beginPath();
                ctx.moveTo(300, 300);
                ctx.arc(300, 300, 280, startAngle, endAngle);
                ctx.closePath();

                ctx.fillStyle = sector.color || defaultColors[i % defaultColors.length];
                ctx.fill();
                ctx.strokeStyle = 'rgba(255,255,255,0.06)';
                ctx.lineWidth = 1;
                ctx.stroke();

                const midAngle = startAngle + sliceAngle / 2;
                const textRadius = 195;
                const x = 300 + Math.cos(midAngle) * textRadius;
                const y = 300 + Math.sin(midAngle) * textRadius;

                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(midAngle + (midAngle > Math.PI / 2 ? Math.PI : 0));
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 14px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.shadowColor = 'rgba(0,0,0,0.5)';
                ctx.shadowBlur = 3;
                const label = sector.label.length > 10 ? sector.label.slice(0, 8) + '…' : sector.label;
                ctx.fillText(label, 0, 0);
                ctx.restore();

                startAngle = endAngle;
            });

            ctx.beginPath();
            ctx.arc(300, 300, 280, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(255,255,255,0.08)';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.fillStyle = '#ff4757';
            ctx.shadowColor = 'rgba(255,71,87,0.3)';
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.moveTo(300, 6);
            ctx.lineTo(285, 28);
            ctx.lineTo(315, 28);
            ctx.closePath();
            ctx.fill();
            ctx.shadowBlur = 0;

            ctx.fillStyle = 'rgba(255,255,255,0.08)';
            ctx.beginPath();
            ctx.arc(300, 33, 4, 0, Math.PI * 2);
            ctx.fill();
        }

        function resetOverlay() {
            if (animationId) {
                cancelAnimationFrame(animationId);
                animationId = null;
            }
            isSpinning = false;
            canvas.classList.remove('spinning');
            if (hideTimeout) {
                clearTimeout(hideTimeout);
                hideTimeout = null;
            }
        }

        function animateSpin() {
            const elapsed = Date.now() - spinStartTime;
            const progress = Math.min(elapsed / spinDuration, 1);
            const eased = 1 - Math.pow(1 - progress, 5);
            currentRotation = spinStartRotation + (spinTargetAngle - spinStartRotation) * eased;
            drawWheel();

            if (progress < 1) {
                animationId = requestAnimationFrame(animateSpin);
            } else {
                currentRotation = spinTargetAngle % (Math.PI * 2);
                drawWheel();
                isSpinning = false;
                canvas.classList.remove('spinning');
                animationId = null;

                // Отправляем сайту команду о завершении
                fetch('/api/webhook', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        mechanic: 'wheel',
                        data: {
                            status: 'completed',
                            spinId: currentSpinId,
                            winner: window._winnerLabel || null,
                        }
                    })
                }).catch(() => {});

                scheduleHide(3000);
            }
        }

        function startSpin(targetAngle, duration, spinId, winnerLabel) {
            if (isSpinning) return;
            if (!sectors || sectors.length === 0) return;

            window._winnerLabel = winnerLabel;

            showOverlay();
            isSpinning = true;
            canvas.classList.add('spinning');
            hideScheduled = false;
            currentSpinId = spinId;

            spinStartTime = Date.now();
            spinDuration = duration || 15000;
            spinStartRotation = currentRotation;
            spinTargetAngle = targetAngle;

            if (animationId) {
                cancelAnimationFrame(animationId);
                animationId = null;
            }

            animateSpin();
        }

        function renderState(data) {
            if (!data || !data.sectors || data.sectors.length === 0) {
                if (isActive && !isSpinning) {
                    resetOverlay();
                    hideOverlay();
                }
                return;
            }

            if (data.sectors) {
                const newSectors = JSON.stringify(data.sectors);
                const oldSectors = JSON.stringify(sectors);
                if (newSectors !== oldSectors) {
                    sectors = data.sectors;
                    if (!isSpinning) drawWheel();
                }
            }

            // Получили команду на запуск
            if (data.status === 'spinning' && data.spinId) {
                // Проверяем, не обрабатывали ли уже этот spinId
                if (!processedSpinIds.has(data.spinId)) {
                    processedSpinIds.add(data.spinId);
                    
                    if (data.targetAngle !== undefined) {
                        if (hideTimeout) {
                            clearTimeout(hideTimeout);
                            hideTimeout = null;
                        }
                        
                        let baseAngle = data.targetAngle;
                        let finalAngle = baseAngle;
                        
                        // Случайное смещение внутри сектора
                        if (data.winnerIndex !== undefined && data.sectors && data.sectors[data.winnerIndex]) {
                            const totalWeight = data.sectors.reduce((sum, s) => sum + s.weight, 0);
                            const sliceAngle = (data.sectors[data.winnerIndex].weight / totalWeight) * Math.PI * 2;
                            const maxOffset = sliceAngle * 0.4;
                            const randomOffset = (Math.random() * 2 - 1) * maxOffset;
                            finalAngle = baseAngle + randomOffset;
                        }
                        
                        const extraSpins = 15 * Math.PI * 2;
                        const targetWithSpins = finalAngle + extraSpins;
                        const duration = data.duration || 15000;
                        startSpin(targetWithSpins, duration, data.spinId, data.winnerLabel);
                    }
                }
                return;
            }

            // Если сайт просит сбросить состояние
            if (data.status === 'reset') {
                processedSpinIds.clear();
                if (isSpinning) {
                    isSpinning = false;
                    canvas.classList.remove('spinning');
                    if (animationId) {
                        cancelAnimationFrame(animationId);
                        animationId = null;
                    }
                }
                if (isActive) {
                    hideOverlay();
                }
                return;
            }
        }

        async function pollState() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                renderState(data);
            } catch (error) {
                // тихо
            }
        }

        setTimeout(pollState, 500);
        setInterval(pollState, 1500);

        drawWheel();

        console.log('🎬 Оверлей "Колесо фортуны" загружен');
        console.log('📡 Опрос состояния каждые 1.5 секунды');
        console.log('🔄 Оверлей управляет анимацией, сайт только даёт команду');
    </script>
</body>
</html>
