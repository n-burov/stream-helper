<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🔫 Снайпер | Оверлей</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: transparent !important;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
        }

        .sniper-overlay {
            display: none;
            position: relative;
            width: 100%;
            max-width: 900px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .sniper-overlay.active {
            display: block;
        }

        .sniper-stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 16px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.5);
        }

        .sniper-stats span strong {
            color: #fff;
            font-weight: 600;
        }

        .sniper-stats .alive strong {
            color: #00ff64;
        }

        .sniper-stats .dead strong {
            color: #ff4757;
        }

        .sniper-arena {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            padding: 12px;
            min-height: 80px;
            max-height: 60vh;
            overflow-y: auto;
            align-content: flex-start;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            justify-content: center;
        }

        .sniper-arena::-webkit-scrollbar {
            width: 4px;
        }

        .sniper-arena::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 10px;
        }

        .sniper-arena::-webkit-scrollbar-thumb {
            background: rgba(145, 70, 255, 0.3);
            border-radius: 10px;
        }

        .sniper-participant {
            display: inline-flex;
            align-items: center;
            padding: 4px 12px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.04);
            border: 2px solid rgba(255, 255, 255, 0.06);
            font-size: 13px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.7);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            user-select: none;
            white-space: nowrap;
            height: 32px;
            position: relative;
        }

        .sniper-participant .id-badge {
            font-size: 9px;
            color: rgba(255, 255, 255, 0.15);
            margin-right: 4px;
            font-weight: 400;
        }

        .sniper-participant.targeted {
            border-color: #ffd700;
            background: rgba(255, 215, 0, 0.15);
            color: #fff;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.2);
            transform: scale(1.05);
            z-index: 2;
            animation: targetPulse 0.2s ease-in-out infinite alternate;
        }

        @keyframes targetPulse {
            0% { box-shadow: 0 0 15px rgba(255, 215, 0, 0.1); transform: scale(1.03); }
            100% { box-shadow: 0 0 40px rgba(255, 215, 0, 0.35); transform: scale(1.08); }
        }

        .sniper-participant .crosshair-icon {
            display: none;
            margin-left: 6px;
            font-size: 12px;
        }

        .sniper-participant.targeted .crosshair-icon {
            display: inline;
            animation: crosshairSpin 0.3s linear infinite;
        }

        @keyframes crosshairSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .sniper-participant.eliminated {
            opacity: 0.4;
            transform: scale(0.9);
            border-color: rgba(255, 0, 0, 0.1);
            color: rgba(255, 255, 255, 0.3);
            text-decoration: line-through;
        }

        .sniper-participant.eliminated .id-badge {
            color: rgba(255, 0, 0, 0.2);
        }

        .sniper-participant.eliminated .skull-icon {
            display: inline-block;
            margin-left: 4px;
            font-size: 14px;
        }

        .sniper-participant .skull-icon {
            display: none;
        }

        .sniper-participant.shot {
            animation: shotEffect 0.9s ease-out forwards;
        }

        @keyframes shotEffect {
            0% {
                border-color: #ffd700;
                box-shadow: 0 0 60px rgba(255, 215, 0, 0.5);
                transform: scale(1.2);
                background: rgba(255, 215, 0, 0.3);
                color: #fff;
            }
            35% {
                border-color: #ff4757;
                box-shadow: 0 0 120px rgba(255, 71, 87, 0.8);
                transform: scale(1.5) rotate(10deg);
                background: rgba(255, 71, 87, 0.4);
            }
            100% {
                opacity: 0.4;
                transform: scale(0.9);
                border-color: rgba(255, 0, 0, 0.1);
                background: rgba(255, 0, 0, 0.05);
                color: rgba(255, 255, 255, 0.3);
                text-decoration: line-through;
            }
        }

        .shot-flash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
            background: radial-gradient(circle at center, rgba(255, 215, 0, 0.4), transparent 70%);
            animation: flashBang 0.35s ease-out forwards;
        }

        @keyframes flashBang {
            0% { opacity: 1; transform: scale(0.5); }
            100% { opacity: 0; transform: scale(2.5); }
        }

        .victim-banner {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, rgba(180, 20, 30, 0.85), rgba(120, 10, 20, 0.9));
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 71, 87, 0.3);
            border-radius: 12px;
            padding: 12px 30px;
            font-size: 24px;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 0 30px rgba(255, 0, 0, 0.2);
            animation: victimAppear 0.3s ease-out;
            z-index: 5;
            white-space: nowrap;
            box-shadow: 0 0 40px rgba(180, 20, 30, 0.15), inset 0 0 40px rgba(255, 71, 87, 0.05);
            letter-spacing: 1px;
        }

        @keyframes victimAppear {
            0% { transform: translateX(-50%) scale(0.5) translateY(20px); opacity: 0; }
            100% { transform: translateX(-50%) scale(1) translateY(0); opacity: 1; }
        }

        .victim-banner.hidden {
            display: none;
        }

        @media (max-width: 768px) {
            .sniper-overlay { padding: 12px; }
            .sniper-participant { font-size: 11px; padding: 3px 10px; height: 26px; }
            .sniper-arena { padding: 8px; gap: 3px; max-height: 50vh; }
            .sniper-stats { font-size: 12px; gap: 16px; }
            .victim-banner { font-size: 18px; padding: 8px 20px; bottom: 12px; }
        }

        @media (max-width: 480px) {
            .sniper-participant { font-size: 10px; padding: 2px 8px; height: 22px; border-radius: 12px; }
            .sniper-participant .id-badge { font-size: 7px; }
            .sniper-stats span { font-size: 10px; }
            .sniper-arena { padding: 6px; gap: 2px; max-height: 40vh; }
            .victim-banner { font-size: 14px; padding: 6px 14px; bottom: 8px; }
        }
    </style>
</head>
<body>

    <audio id="shotSound" preload="auto">
        <source src="../sounds/shot.mp3" type="audio/mpeg">
    </audio>

    <div class="sniper-overlay" id="sniperOverlay">
        <div class="sniper-stats">
            <span class="alive">🟢 Живых: <strong id="sniperAlive">0</strong></span>
            <span class="dead">💀 Выбыло: <strong id="sniperDead">0</strong></span>
            <span>👥 Всего: <strong id="sniperTotal">0</strong></span>
        </div>
        <div class="sniper-arena" id="sniperArena">
            <div style="width:100%; text-align:center; color:rgba(255,255,255,0.15); padding:30px; font-size:14px;">Ожидание участников...</div>
        </div>
        <div class="victim-banner hidden" id="victimBanner">💀 Жертва</div>
    </div>

    <script>
        const MECHANIC = 'sniper';
        const API_URL = `/api/webhook?mechanic=${MECHANIC}`;

        let isAnimating = false;
        let animTimer = null;
        let lastVictimId = null;
        let overlayParticipants = [];
        let isActive = false;
        let currentSpinId = null;
        let hideTimeout = null;
        let isWinnerShown = false;
        let isBlocked = false;

        const overlay = document.getElementById('sniperOverlay');
        const arena = document.getElementById('sniperArena');
        const aliveEl = document.getElementById('sniperAlive');
        const deadEl = document.getElementById('sniperDead');
        const totalEl = document.getElementById('sniperTotal');
        const victimBanner = document.getElementById('victimBanner');
        const shotSound = document.getElementById('shotSound');

        function fullReset() {
            if (animTimer) { clearTimeout(animTimer); animTimer = null; }
            if (hideTimeout) { clearTimeout(hideTimeout); hideTimeout = null; }
            isAnimating = false;
            isActive = false;
            isWinnerShown = false;
            lastVictimId = null;
            currentSpinId = null;
            overlay.classList.remove('active');
            victimBanner.classList.add('hidden');
        }

        function showOverlay() {
            if (isBlocked) return;
            if (!isActive) {
                isActive = true;
                isWinnerShown = false;
                overlay.classList.add('active');
            }
            if (hideTimeout) { clearTimeout(hideTimeout); hideTimeout = null; }
        }

        function showVictim(name) {
            victimBanner.textContent = `💀 ${name}`;
            victimBanner.classList.remove('hidden');
            setTimeout(() => { victimBanner.classList.add('hidden'); }, 2500);
        }

        function createFlash() {
            const flash = document.createElement('div');
            flash.className = 'shot-flash';
            document.body.appendChild(flash);
            setTimeout(() => flash.remove(), 400);
        }

        function renderArena(targetId, shotVictimId) {
            const all = overlayParticipants;
            if (!all || all.length === 0) {
                arena.innerHTML = `<div style="width:100%; text-align:center; color:rgba(255,255,255,0.15); padding:30px; font-size:14px;">Ожидание участников...</div>`;
                return;
            }

            const alive = all.filter(p => p.alive);
            const dead = all.filter(p => !p.alive);
            aliveEl.textContent = alive.length;
            deadEl.textContent = dead.length;
            totalEl.textContent = all.length;

            const sorted = [...all].sort((a, b) => {
                if (a.alive && !b.alive) return -1;
                if (!a.alive && b.alive) return 1;
                return a.id - b.id;
            });

            arena.innerHTML = sorted.map((p) => {
                const isTargeted = targetId === p.id && p.alive;
                const isEliminated = !p.alive;
                const isVictim = shotVictimId === p.id && p.alive === false;
                let classes = 'sniper-participant';
                if (isEliminated) classes += ' eliminated';
                if (isTargeted) classes += ' targeted';
                if (isVictim) classes += ' shot';
                const skullIcon = isEliminated ? '<span class="skull-icon">💀</span>' : '';
                return `<div class="${classes}" data-id="${p.id}"><span class="id-badge">#${p.id}</span>${p.name}${skullIcon}<span class="crosshair-icon">🎯</span></div>`;
            }).join('');
        }

        function setShotStatus(victimId) {
            fetch('/api/webhook', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    mechanic: 'sniper',
                    data: { status: 'shot', spinId: currentSpinId, victimId: victimId }
                })
            }).catch(() => {});
        }

        function runAnimation(victimId, spinId) {
            if (isAnimating) return;
            if (!victimId) return;
            if (!overlayParticipants || overlayParticipants.length === 0) return;

            const victim = overlayParticipants.find(p => p.id === victimId);
            if (!victim || !victim.alive) return;

            if (hideTimeout) { clearTimeout(hideTimeout); hideTimeout = null; }

            currentSpinId = spinId;
            isAnimating = true;

            const alive = overlayParticipants.filter(p => p.alive);
            if (alive.length <= 1) {
                isAnimating = false;
                renderArena(null, null);
                setShotStatus(victimId);
                return;
            }

            const targets = alive;
            let currentTargetIdx = Math.floor(Math.random() * targets.length);
            let steps = 0;
            const maxSteps = 14 + Math.floor(Math.random() * 10);
            let delay = 80 + Math.random() * 40;

            function animateStep() {
                if (steps >= maxSteps) {
                    finishAiming();
                    return;
                }
                let nextIdx;
                let attempts = 0;
                do {
                    nextIdx = Math.floor(Math.random() * targets.length);
                    attempts++;
                } while (nextIdx === currentTargetIdx && attempts < 20 && targets.length > 1);
                currentTargetIdx = nextIdx;
                const target = targets[currentTargetIdx];
                renderArena(target.id, null);
                steps++;
                delay *= 1.09;
                const currentDelay = Math.min(delay, 350);
                animTimer = setTimeout(animateStep, currentDelay);
            }

            function finishAiming() {
                const victimAlive = overlayParticipants.find(p => p.id === victimId && p.alive);
                if (!victimAlive) {
                    isAnimating = false;
                    renderArena(null, null);
                    setShotStatus(victimId);
                    return;
                }
                renderArena(victimId, null);
                animTimer = setTimeout(() => { executeShot(victimId); }, 600 + Math.random() * 400);
            }

            function executeShot(shotId) {
                const victim = overlayParticipants.find(p => p.id === shotId);
                if (!victim) {
                    isAnimating = false;
                    renderArena(null, null);
                    setShotStatus(shotId);
                    return;
                }
                createFlash();
                showVictim(victim.name);

                // Звук выстрела
                shotSound.currentTime = 0;
                shotSound.play().catch(() => {});

                victim.alive = false;
                renderArena(null, shotId);
                setShotStatus(shotId);
                animTimer = setTimeout(() => {
                    isAnimating = false;
                    renderArena(null, null);
                    if (animTimer) { clearTimeout(animTimer); animTimer = null; }
                }, 900);
            }
            animateStep();
        }

        function renderState(data) {
            if (data && data.status === 'reset') {
                isBlocked = false;
                fullReset();
                return;
            }

            if (isBlocked) {
                return;
            }

            if (!data || !data.participants || data.participants.length === 0) {
                if (isActive && !isAnimating) fullReset();
                return;
            }

            const hasAlive = data.participants.some(p => p.alive);
            if (!hasAlive) {
                if (isActive && !isAnimating) fullReset();
                return;
            }

            if (data.status === 'shooting' && data.victimId && data.spinId) {
                if (data.victimId !== lastVictimId) {
                    lastVictimId = data.victimId;
                    overlayParticipants = JSON.parse(JSON.stringify(data.participants));
                    const alive = overlayParticipants.filter(p => p.alive);
                    if (alive.length > 1) {
                        showOverlay();
                        runAnimation(data.victimId, data.spinId);
                    } else {
                        setShotStatus(data.victimId);
                    }
                }
                return;
            }

            if (data.status === 'winner' && data.winnerName) {
                if (!isWinnerShown) {
                    isWinnerShown = true;
                    overlayParticipants = JSON.parse(JSON.stringify(data.participants));
                    renderArena(null, null);
                    
                    if (!isActive) {
                        showOverlay();
                    }
                    
                    if (hideTimeout) clearTimeout(hideTimeout);
                    hideTimeout = setTimeout(() => {
                        isBlocked = true;
                        fullReset();
                        hideTimeout = null;
                    }, 2500);
                }
                return;
            }

            if (isActive && !isAnimating && !isWinnerShown) {
                overlayParticipants = JSON.parse(JSON.stringify(data.participants));
                renderArena(null, null);
            }
        }

        async function pollState() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                renderState(data);
            } catch (error) {
                console.error('Poll error:', error);
            }
        }

        setTimeout(pollState, 500);
        setInterval(pollState, 500);

        console.log('🎬 Оверлей "Снайпер" загружен');
    </script>
</body>
</html>
