<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🔫 Снайпер | Оверлей</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: transparent !important;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
        }

        .sniper-overlay {
            display: none;
            position: relative;
            width: 100%;
            max-width: 900px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .sniper-overlay.active {
            display: block;
        }

        .sniper-stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 16px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.5);
        }

        .sniper-stats span strong {
            color: #fff;
            font-weight: 600;
        }

        .sniper-stats .alive strong {
            color: #00ff64;
        }

        .sniper-stats .dead strong {
            color: #ff4757;
        }

        .sniper-arena {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            padding: 12px;
            min-height: 80px;
            max-height: 60vh;
            overflow-y: auto;
            align-content: flex-start;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            justify-content: center;
        }

        .sniper-arena::-webkit-scrollbar {
            width: 4px;
        }

        .sniper-arena::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 10px;
        }

        .sniper-arena::-webkit-scrollbar-thumb {
            background: rgba(145, 70, 255, 0.3);
            border-radius: 10px;
        }

        .sniper-participant {
            display: inline-flex;
            align-items: center;
            padding: 4px 12px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.04);
            border: 2px solid rgba(255, 255, 255, 0.06);
            font-size: 13px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.7);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            user-select: none;
            white-space: nowrap;
            height: 32px;
            position: relative;
        }

        .sniper-participant .id-badge {
            font-size: 9px;
            color: rgba(255, 255, 255, 0.15);
            margin-right: 4px;
            font-weight: 400;
        }

        .sniper-participant.targeted {
            border-color: #ffd700;
            background: rgba(255, 215, 0, 0.15);
            color: #fff;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.2);
            transform: scale(1.05);
            z-index: 2;
            animation: targetPulse 0.2s ease-in-out infinite alternate;
        }

        @keyframes targetPulse {
            0% {
                box-shadow: 0 0 15px rgba(255, 215, 0, 0.1);
                transform: scale(1.03);
            }
            100% {
                box-shadow: 0 0 40px rgba(255, 215, 0, 0.35);
                transform: scale(1.08);
            }
        }

        .sniper-participant .crosshair-icon {
            display: none;
            margin-left: 6px;
            font-size: 12px;
        }

        .sniper-participant.targeted .crosshair-icon {
            display: inline;
            animation: crosshairSpin 0.3s linear infinite;
        }

        @keyframes crosshairSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .sniper-participant.eliminated {
            opacity: 0.12;
            transform: scale(0.8);
            border-color: rgba(255, 0, 0, 0.03);
            text-decoration: line-through;
            color: rgba(255, 255, 255, 0.1);
        }

        .sniper-participant.eliminated .id-badge {
            color: rgba(255, 0, 0, 0.15);
        }

        .sniper-participant.shot {
            animation: shotEffect 0.9s ease-out forwards;
        }

        @keyframes shotEffect {
            0% {
                border-color: #ffd700;
                box-shadow: 0 0 60px rgba(255, 215, 0, 0.5);
                transform: scale(1.2);
                background: rgba(255, 215, 0, 0.3);
                color: #fff;
            }
            35% {
                border-color: #ff4757;
                box-shadow: 0 0 120px rgba(255, 71, 87, 0.8);
                transform: scale(1.5) rotate(10deg);
                background: rgba(255, 71, 87, 0.4);
            }
            100% {
                opacity: 0.1;
                transform: scale(0.6);
                border-color: rgba(255, 0, 0, 0.02);
                background: transparent;
                color: rgba(255, 255, 255, 0.03);
            }
        }

        .shot-flash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
            background: radial-gradient(circle at center, rgba(255, 215, 0, 0.4), transparent 70%);
            animation: flashBang 0.35s ease-out forwards;
        }

        @keyframes flashBang {
            0% { opacity: 1; transform: scale(0.5); }
            100% { opacity: 0; transform: scale(2.5); }
        }

        .winner-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 48px;
            font-weight: 900;
            background: linear-gradient(135deg, #f9ca24, #f0932b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 60px rgba(249, 202, 36, 0.3);
            animation: winnerPop 0.6s ease;
            z-index: 10;
            pointer-events: none;
            text-align: center;
        }

        @keyframes winnerPop {
            0% { transform: translate(-50%, -50%) scale(0.5) rotate(-10deg); opacity: 0; }
            60% { transform: translate(-50%, -50%) scale(1.1) rotate(2deg); }
            100% { transform: translate(-50%, -50%) scale(1) rotate(0deg); opacity: 1; }
        }

        @media (max-width: 768px) {
            .sniper-overlay {
                padding: 12px;
            }
            .sniper-participant {
                font-size: 11px;
                padding: 3px 10px;
                height: 26px;
            }
            .sniper-arena {
                padding: 8px;
                gap: 3px;
                max-height: 50vh;
            }
            .sniper-stats {
                font-size: 12px;
                gap: 16px;
            }
            .winner-text {
                font-size: 32px;
            }
        }

        @media (max-width: 480px) {
            .sniper-participant {
                font-size: 10px;
                padding: 2px 8px;
                height: 22px;
                border-radius: 12px;
            }
            .sniper-participant .id-badge {
                font-size: 7px;
            }
            .sniper-stats span {
                font-size: 10px;
            }
            .sniper-arena {
                padding: 6px;
                gap: 2px;
                max-height: 40vh;
            }
            .winner-text {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>

    <div class="sniper-overlay" id="sniperOverlay">
        <div class="sniper-stats">
            <span class="alive">🟢 Живых: <strong id="sniperAlive">0</strong></span>
            <span class="dead">💀 Выбыло: <strong id="sniperDead">0</strong></span>
            <span>👥 Всего: <strong id="sniperTotal">0</strong></span>
        </div>
        <div class="sniper-arena" id="sniperArena">
            <div style="width:100%; text-align:center; color:rgba(255,255,255,0.15); padding:30px; font-size:14px;">Ожидание участников...</div>
        </div>
    </div>

    <script>
        const API_URL = '/api/webhook?mechanic=sniper';
        let overlayVisible = false;
        let hideTimeout = null;
        let isAnimating = false;
        let animTimer = null;
        let lastVictimId = null;
        let lastParticipants = [];
        let overlayParticipants = [];

        const overlay = document.getElementById('sniperOverlay');
        const arena = document.getElementById('sniperArena');
        const aliveEl = document.getElementById('sniperAlive');
        const deadEl = document.getElementById('sniperDead');
        const totalEl = document.getElementById('sniperTotal');

        function showOverlay() {
            overlay.classList.add('active');
            overlayVisible = true;
            if (hideTimeout) {
                clearTimeout(hideTimeout);
                hideTimeout = null;
            }
        }

        function hideOverlay() {
            overlay.classList.remove('active');
            overlayVisible = false;
            if (hideTimeout) {
                clearTimeout(hideTimeout);
                hideTimeout = null;
            }
        }

        function createFlash() {
            const flash = document.createElement('div');
            flash.className = 'shot-flash';
            document.body.appendChild(flash);
            setTimeout(() => flash.remove(), 400);
        }

        function renderArena(targetId, shotVictimId, participants) {
            const all = participants || overlayParticipants;
            if (!all || all.length === 0) {
                arena.innerHTML = `
                    <div style="width:100%; text-align:center; color:rgba(255,255,255,0.15); padding:30px; font-size:14px;">Ожидание участников...</div>
                `;
                return;
            }

            const alive = all.filter(p => p.alive);
            const dead = all.filter(p => !p.alive);

            aliveEl.textContent = alive.length;
            deadEl.textContent = dead.length;
            totalEl.textContent = all.length;

            const sorted = [...all].sort((a, b) => {
                if (a.alive && !b.alive) return -1;
                if (!a.alive && b.alive) return 1;
                return a.id - b.id;
            });

            arena.innerHTML = sorted.map((p) => {
                const isTargeted = targetId === p.id && p.alive;
                const isEliminated = !p.alive;
                const isVictim = shotVictimId === p.id && p.alive === false;

                let classes = 'sniper-participant';
                if (isEliminated) classes += ' eliminated';
                if (isTargeted) classes += ' targeted';
                if (isVictim) classes += ' shot';

                return `
                    <div class="${classes}" data-id="${p.id}">
                        <span class="id-badge">#${p.id}</span>
                        ${p.name}
                        <span class="crosshair-icon">🎯</span>
                    </div>
                `;
            }).join('');
        }

        function startOverlayAnimation(victimId, participants) {
            if (isAnimating) return;
            if (!victimId) return;
            if (!participants || participants.length === 0) return;

            overlayParticipants = JSON.parse(JSON.stringify(participants));
            const victim = overlayParticipants.find(p => p.id === victimId);
            if (!victim || !victim.alive) return;

            isAnimating = true;
            let currentTargetId = null;

            const alive = overlayParticipants.filter(p => p.alive);
            if (alive.length <= 1) {
                isAnimating = false;
                renderArena(null, null, overlayParticipants);
                return;
            }

            const targets = alive;
            let currentTargetIdx = Math.floor(Math.random() * targets.length);
            let steps = 0;
            const maxSteps = 14 + Math.floor(Math.random() * 10);
            let delay = 80 + Math.random() * 40;

            function animateStep() {
                if (steps >= maxSteps) {
                    finishAiming();
                    return;
                }

                let nextIdx;
                let attempts = 0;
                do {
                    nextIdx = Math.floor(Math.random() * targets.length);
                    attempts++;
                } while (nextIdx === currentTargetIdx && attempts < 20 && targets.length > 1);

                currentTargetIdx = nextIdx;
                const target = targets[currentTargetIdx];
                currentTargetId = target.id;

                renderArena(currentTargetId, null, overlayParticipants);

                steps++;
                delay *= 1.09;
                const currentDelay = Math.min(delay, 350);

                animTimer = setTimeout(animateStep, currentDelay);
            }

            function finishAiming() {
                const victimAlive = overlayParticipants.find(p => p.id === victimId && p.alive);
                if (!victimAlive) {
                    isAnimating = false;
                    renderArena(null, null, overlayParticipants);
                    return;
                }

                renderArena(victimId, null, overlayParticipants);

                animTimer = setTimeout(() => {
                    executeOverlayShot(victimId);
                }, 600 + Math.random() * 400);
            }

            function executeOverlayShot(shotId) {
                const victim = overlayParticipants.find(p => p.id === shotId);
                if (!victim) {
                    isAnimating = false;
                    renderArena(null, null, overlayParticipants);
                    return;
                }

                createFlash();

                victim.alive = false;
                renderArena(null, shotId, overlayParticipants);

                animTimer = setTimeout(() => {
                    isAnimating = false;
                    renderArena(null, null, overlayParticipants);

                    const aliveLeft = overlayParticipants.filter(p => p.alive);
                    if (aliveLeft.length === 1) {
                        const winner = aliveLeft[0];
                        const winnerEl = document.createElement('div');
                        winnerEl.className = 'winner-text';
                        winnerEl.textContent = `🏆 ${winner.name}`;
                        overlay.appendChild(winnerEl);
                        setTimeout(() => {
                            if (winnerEl.parentNode) winnerEl.remove();
                        }, 4000);
                    }

                    if (hideTimeout) clearTimeout(hideTimeout);
                    hideTimeout = setTimeout(() => {
                        if (!isAnimating) {
                            hideOverlay();
                        }
                    }, 3000);
                }, 900);
            }

            animateStep();
        }

        function renderState(data) {
            if (!data || !data.participants || data.participants.length === 0) {
                if (overlayVisible && !isAnimating) {
                    hideTimeout = setTimeout(hideOverlay, 3000);
                }
                return;
            }

            showOverlay();

            // Если есть victimId и он новый — запускаем анимацию
            if (data.victimId && data.victimId !== lastVictimId && !isAnimating) {
                lastVictimId = data.victimId;
                lastParticipants = JSON.parse(JSON.stringify(data.participants));
                startOverlayAnimation(data.victimId, data.participants);
                return;
            }

            // Если анимация не идёт — просто показываем состояние
            if (!isAnimating) {
                overlayParticipants = JSON.parse(JSON.stringify(data.participants));
                renderArena(null, null, overlayParticipants);

                // Если есть победитель
                if (data.status === 'winner' || data.winnerName) {
                    const winner = overlayParticipants.find(p => p.alive);
                    if (winner) {
                        const winnerEl = document.createElement('div');
                        winnerEl.className = 'winner-text';
                        winnerEl.textContent = `🏆 ${winner.name}`;
                        overlay.appendChild(winnerEl);
                        setTimeout(() => {
                            if (winnerEl.parentNode) winnerEl.remove();
                        }, 4000);
                    }
                    if (hideTimeout) clearTimeout(hideTimeout);
                    hideTimeout = setTimeout(() => {
                        if (!isAnimating) {
                            hideOverlay();
                        }
                    }, 4000);
                }
            }
        }

        async function pollState() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                renderState(data);
            } catch (error) {
                console.error('Poll error:', error);
            }
        }

        setTimeout(pollState, 500);
        setInterval(pollState, 500);

        console.log('🎬 Оверлей "Снайпер" загружен');
        console.log('📡 Опрос состояния каждые 0.5 секунды');
    </script>
</body>
</html>
